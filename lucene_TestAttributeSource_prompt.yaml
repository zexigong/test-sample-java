    \ Apache License, Version 2.0\n * (the \"License\"); you may not use this file\
    \ except in compliance with\n * the License.  You may obtain a copy of the License\
    \ at\n *\n *     http://www.apache.org/licenses/LICENSE-2.0\n *\n * Unless required\
    \ by applicable law or agreed to in writing, software\n * distributed under the\
    \ License is distributed on an \"AS IS\" BASIS,\n * WITHOUT WARRANTIES OR CONDITIONS\
    \ OF ANY KIND, either express or implied.\n * See the License for the specific\
    \ language governing permissions and\n * limitations under the License.\n */\n\
    package org.apache.lucene.analysis;\n\nimport java.io.Closeable;\nimport java.io.IOException;\n\
    import java.lang.reflect.Modifier;\nimport org.apache.lucene.analysis.tokenattributes.PackedTokenAttributeImpl;\n\
    import org.apache.lucene.document.Document;\nimport org.apache.lucene.document.Field;\n\
    import org.apache.lucene.index.IndexWriter;\nimport org.apache.lucene.util.Attribute;\n\
    import org.apache.lucene.util.AttributeFactory;\nimport org.apache.lucene.util.AttributeImpl;\n\
    import org.apache.lucene.util.AttributeSource;\n\n/**\n * A <code>TokenStream</code>\
    \ enumerates the sequence of tokens, either from {@link Field}s of a\n * {@link\
    \ Document} or from query text.\n *\n * <p>This is an abstract class; concrete\
    \ subclasses are:\n *\n * <ul>\n *   <li>{@link Tokenizer}, a <code>TokenStream</code>\
    \ whose input is a Reader; and\n *   <li>{@link TokenFilter}, a <code>TokenStream</code>\
    \ whose input is another <code>TokenStream\n *       </code>.\n * </ul>\n *\n\
    \ * <code>TokenStream</code> extends {@link AttributeSource}, which provides access\
    \ to all of the\n * token {@link Attribute}s for the <code>TokenStream</code>.\
    \ Note that only one instance per {@link\n * AttributeImpl} is created and reused\
    \ for every token. This approach reduces object creation and\n * allows local\
    \ caching of references to the {@link AttributeImpl}s. See {@link #incrementToken()}\n\
    \ * for further details.\n *\n * <p><b>The workflow of the new <code>TokenStream</code>\
    \ API is as follows:</b>\n *\n * <ol>\n *   <li>Instantiation of <code>TokenStream</code>/{@link\
    \ TokenFilter}s which add/get attributes\n *       to/from the {@link AttributeSource}.\n\
    \ *   <li>The consumer calls {@link TokenStream#reset()}.\n *   <li>The consumer\
    \ retrieves attributes from the stream and stores local references to all\n *\
    \       attributes it wants to access.\n *   <li>The consumer calls {@link #incrementToken()}\
    \ until it returns false consuming the\n *       attributes after each call.\n\
    \ *   <li>The consumer calls {@link #end()} so that any end-of-stream operations\
    \ can be performed.\n *   <li>The consumer calls {@link #close()} to release any\
    \ resource when finished using the <code>\n *       TokenStream</code>.\n * </ol>\n\
    \ *\n * To make sure that filters and consumers know which attributes are available,\
    \ the attributes must\n * be added during instantiation. Filters and consumers\
    \ are not required to check for availability\n * of attributes in {@link #incrementToken()}.\n\
    \ *\n * <p>You can find some example code for the new API in the analysis package\
    \ level Javadoc.\n *\n * <p>Sometimes it is desirable to capture a current state\
    \ of a <code>TokenStream</code>, e.g., for\n * buffering purposes (see {@link\
    \ CachingTokenFilter}, TeeSinkTokenFilter). For this usecase {@link\n * AttributeSource#captureState}\
    \ and {@link AttributeSource#restoreState} can be used.\n *\n * <p>The {@code\
    \ TokenStream}-API in Lucene is based on the decorator pattern. Therefore all\n\
    \ * non-abstract subclasses must be final or have at least a final implementation\
    \ of {@link\n * #incrementToken}! This is checked when Java assertions are enabled.\n\
    \ */\npublic abstract class TokenStream extends AttributeSource implements Closeable\
    \ {\n\n  /** Default {@link AttributeFactory} instance that should be used for\
    \ TokenStreams. */\n  public static final AttributeFactory DEFAULT_TOKEN_ATTRIBUTE_FACTORY\
    \ =\n      AttributeFactory.getStaticImplementation(\n          AttributeFactory.DEFAULT_ATTRIBUTE_FACTORY,\
    \ PackedTokenAttributeImpl.class);\n\n  /** A TokenStream using the default attribute\
    \ factory. */\n  protected TokenStream() {\n    super(DEFAULT_TOKEN_ATTRIBUTE_FACTORY);\n\
    \    assert assertFinal();\n  }\n\n  /** A TokenStream that uses the same attributes\
    \ as the supplied one. */\n  protected TokenStream(AttributeSource input) {\n\
    \    super(input);\n    assert assertFinal();\n  }\n\n  /**\n   * A TokenStream\
    \ using the supplied AttributeFactory for creating new {@link Attribute} instances.\n\
    \   */\n  protected TokenStream(AttributeFactory factory) {\n    super(factory);\n\
    \    assert assertFinal();\n  }\n\n  private boolean assertFinal() {\n    try\
    \ {\n      final Class<?> clazz = getClass();\n      if (!clazz.desiredAssertionStatus())\
    \ return true;\n      assert clazz.isAnonymousClass()\n              || (clazz.getModifiers()\
    \ & (Modifier.FINAL | Modifier.PRIVATE)) != 0\n              || Modifier.isFinal(clazz.getMethod(\"\
    incrementToken\").getModifiers())\n          : \"TokenStream implementation classes\
    \ or at least their incrementToken() implementation must be final\";\n      return\
    \ true;\n    } catch (\n        @SuppressWarnings(\"unused\")\n        NoSuchMethodException\
    \ nsme) {\n      return false;\n    }\n  }\n\n  /**\n   * Consumers (i.e., {@link\
    \ IndexWriter}) use this method to advance the stream to the next token.\n   *\
    \ Implementing classes must implement this method and update the appropriate {@link\n\
    \   * AttributeImpl}s with the attributes of the next token.\n   *\n   * <p>The\
    \ producer must make no assumptions about the attributes after the method has\

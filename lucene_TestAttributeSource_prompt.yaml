    \ WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n * See the\
    \ License for the specific language governing permissions and\n * limitations\
    \ under the License.\n */\npackage org.apache.lucene.util;\n\nimport java.util.Collections;\n\
    import java.util.Iterator;\nimport java.util.LinkedHashMap;\nimport java.util.LinkedHashSet;\n\
    import java.util.Map;\nimport java.util.Map.Entry;\nimport java.util.NoSuchElementException;\n\
    import java.util.Objects;\nimport java.util.Set;\nimport org.apache.lucene.analysis.TokenStream;\
    \ // for javadocs\n\n/**\n * An AttributeSource contains a list of different {@link\
    \ AttributeImpl}s, and methods to add and\n * get them. There can only be a single\
    \ instance of an attribute in the same AttributeSource\n * instance. This is ensured\
    \ by passing in the actual type of the Attribute (Class&lt;Attribute&gt;)\n *\
    \ to the {@link #addAttribute(Class)}, which then checks if an instance of that\
    \ type is already\n * present. If yes, it returns the instance, otherwise it creates\
    \ a new instance and returns it.\n */\npublic class AttributeSource {\n\n  /**\n\
    \   * This class holds the state of an AttributeSource.\n   *\n   * @see #captureState\n\
    \   * @see #restoreState\n   */\n  public static final class State implements\
    \ Cloneable {\n    AttributeImpl attribute;\n    State next;\n\n    @Override\n\
    \    public State clone() {\n      State clone = new State();\n      clone.attribute\
    \ = attribute.clone();\n\n      if (next != null) {\n        clone.next = next.clone();\n\
    \      }\n\n      return clone;\n    }\n  }\n\n  // These two maps must always\
    \ be in sync!!!\n  // So they are private, final and read-only from the outside\
    \ (read-only iterators)\n  private final Map<Class<? extends Attribute>, AttributeImpl>\
    \ attributes;\n  private final Map<Class<? extends AttributeImpl>, AttributeImpl>\
    \ attributeImpls;\n  private final State[] currentState;\n\n  private final AttributeFactory\
    \ factory;\n\n  /**\n   * An AttributeSource using the default attribute factory\
    \ {@link\n   * AttributeFactory#DEFAULT_ATTRIBUTE_FACTORY}.\n   */\n  public AttributeSource()\
    \ {\n    this(AttributeFactory.DEFAULT_ATTRIBUTE_FACTORY);\n  }\n\n  /** An AttributeSource\
    \ that uses the same attributes as the supplied one. */\n  public AttributeSource(AttributeSource\
    \ input) {\n    Objects.requireNonNull(input, \"input AttributeSource must not\
    \ be null\");\n    this.attributes = input.attributes;\n    this.attributeImpls\
    \ = input.attributeImpls;\n    this.currentState = input.currentState;\n    this.factory\
    \ = input.factory;\n  }\n\n  /**\n   * An AttributeSource using the supplied {@link\
    \ AttributeFactory} for creating new {@link\n   * Attribute} instances.\n   */\n\
    \  public AttributeSource(AttributeFactory factory) {\n    this.attributes = new\
    \ LinkedHashMap<>();\n    this.attributeImpls = new LinkedHashMap<>();\n    this.currentState\
    \ = new State[1];\n    this.factory = Objects.requireNonNull(factory, \"AttributeFactory\
    \ must not be null\");\n  }\n\n  /** returns the used AttributeFactory. */\n \
    \ public final AttributeFactory getAttributeFactory() {\n    return this.factory;\n\
    \  }\n\n  /**\n   * Returns a new iterator that iterates the attribute classes\
    \ in the same order they were added\n   * in.\n   */\n  public final Iterator<Class<?\
    \ extends Attribute>> getAttributeClassesIterator() {\n    return Collections.unmodifiableSet(attributes.keySet()).iterator();\n\
    \  }\n\n  /**\n   * Returns a new iterator that iterates all unique Attribute\
    \ implementations. This iterator may\n   * contain less entries that {@link #getAttributeClassesIterator},\
    \ if one instance implements more\n   * than one Attribute interface.\n   */\n\
    \  public final Iterator<AttributeImpl> getAttributeImplsIterator() {\n    final\
    \ State initState = getCurrentState();\n    if (initState != null) {\n      return\
    \ new Iterator<AttributeImpl>() {\n        private State state = initState;\n\n\
    \        @Override\n        public void remove() {\n          throw new UnsupportedOperationException();\n\
    \        }\n\n        @Override\n        public AttributeImpl next() {\n     \
    \     if (state == null) throw new NoSuchElementException();\n          final\
    \ AttributeImpl att = state.attribute;\n          state = state.next;\n      \
    \    return att;\n        }\n\n        @Override\n        public boolean hasNext()\
    \ {\n          return state != null;\n        }\n      };\n    } else {\n    \
    \  return Collections.<AttributeImpl>emptySet().iterator();\n    }\n  }\n\n  /**\n\
    \   * a cache that stores all interfaces for known implementation classes for\
    \ performance (slow\n   * reflection)\n   */\n  private static final ClassValue<Class<?\
    \ extends Attribute>[]> implInterfaces =\n      new ClassValue<Class<? extends\
    \ Attribute>[]>() {\n        @Override\n        protected Class<? extends Attribute>[]\
    \ computeValue(Class<?> clazz) {\n          final Set<Class<? extends Attribute>>\
    \ intfSet = new LinkedHashSet<>();\n          // find all interfaces that this\
    \ attribute instance implements\n          // and that extend the Attribute interface\n\
    \          do {\n            for (Class<?> curInterface : clazz.getInterfaces())\
    \ {\n              if (curInterface != Attribute.class\n                  && Attribute.class.isAssignableFrom(curInterface))\
    \ {\n                intfSet.add(curInterface.asSubclass(Attribute.class));\n\
    \              }\n            }\n            clazz = clazz.getSuperclass();\n\
    \          } while (clazz != null);\n          @SuppressWarnings({\"unchecked\"\
    , \"rawtypes\"})\n          final Class<? extends Attribute>[] a = intfSet.toArray(new\
    \ Class[intfSet.size()]);\n          return a;\n        }\n      };\n\n  static\
    \ Class<? extends Attribute>[] getAttributeInterfaces(\n      final Class<? extends\
    \ AttributeImpl> clazz) {\n    return implInterfaces.get(clazz);\n  }\n\n  /**\n\
    \   * <b>Expert:</b> Adds a custom AttributeImpl instance with one or more Attribute\
    \ interfaces.\n   *\n   * <p><b>NOTE:</b> It is not guaranteed, that <code>att</code>\
    \ is added to the <code>\n   * AttributeSource</code>, because the provided attributes\
    \ may already exist. You should always\n   * retrieve the wanted attributes using\
    \ {@link #getAttribute} after adding with this method and\n   * cast to your class.\
    \ The recommended way to use custom implementations is using an {@link\n   * AttributeFactory}.\n\
    \   *\n   * <p>This method will only add the Attribute interfaces directly implemented\
    \ by the class and its\n   * super classes.\n   */\n  public final void addAttributeImpl(final\
    \ AttributeImpl att) {\n    final Class<? extends AttributeImpl> clazz = att.getClass();\n\
    \    if (attributeImpls.containsKey(clazz)) return;\n\n    // add all interfaces\
    \ of this AttributeImpl to the maps\n    for (final Class<? extends Attribute>\
    \ curInterface : getAttributeInterfaces(clazz)) {\n      // Attribute is a superclass\
    \ of this interface\n      if (!attributes.containsKey(curInterface)) {\n    \
    \    // invalidate state to force recomputation in captureState()\n        this.currentState[0]\
    \ = null;\n        attributes.put(curInterface, att);\n        attributeImpls.put(clazz,\
    \ att);\n      }\n    }\n  }\n\n  /**\n   * The caller must pass in a Class&lt;?\
    \ extends Attribute&gt; value. This method first checks if\n   * an instance of\
    \ that class is already in this AttributeSource and returns it. Otherwise a new\n\
    \   * instance is created, added to this AttributeSource and returned.\n   */\n\
    \  public final <T extends Attribute> T addAttribute(Class<T> attClass) {\n  \
    \  AttributeImpl attImpl = attributes.get(attClass);\n    if (attImpl == null)\
    \ {\n      if (!(attClass.isInterface() && Attribute.class.isAssignableFrom(attClass)))\
    \ {\n        throw new IllegalArgumentException(\n            \"addAttribute()\
    \ only accepts an interface that extends Attribute, but \"\n                +\
    \ attClass.getName()\n                + \" does not fulfil this contract.\");\n\
    \      }\n      addAttributeImpl(attImpl = this.factory.createAttributeInstance(attClass));\n\
    \    }\n    return attClass.cast(attImpl);\n  }\n\n  /** Returns true, iff this\
    \ AttributeSource has any attributes */\n  public final boolean hasAttributes()\
    \ {\n    return !this.attributes.isEmpty();\n  }\n\n  /**\n   * The caller must\
    \ pass in a Class&lt;? extends Attribute&gt; value. Returns true, iff this\n \
    \  * AttributeSource contains the passed-in Attribute.\n   */\n  public final\
    \ boolean hasAttribute(Class<? extends Attribute> attClass) {\n    return this.attributes.containsKey(attClass);\n\
    \  }\n\n  /**\n   * Returns the instance of the passed in Attribute contained\
    \ in this AttributeSource\n   *\n   * <p>The caller must pass in a Class&lt;?\
    \ extends Attribute&gt; value.\n   *\n   * @return instance of the passed in Attribute,\
    \ or {@code null} if this AttributeSource does not\n   *     contain the Attribute.\
    \ It is recommended to always use {@link #addAttribute} even in\n   *     consumers\
    \ of TokenStreams, because you cannot know if a specific TokenStream really uses\
    \ a\n   *     specific Attribute. {@link #addAttribute} will automatically make\
    \ the attribute available.\n   *     If you want to only use the attribute, if\
    \ it is available (to optimize consuming), use\n   *     {@link #hasAttribute}.\n\
    \   */\n  public final <T extends Attribute> T getAttribute(Class<T> attClass)\
    \ {\n    return attClass.cast(attributes.get(attClass));\n  }\n\n  private State\
    \ getCurrentState() {\n    State s = currentState[0];\n    if (s != null || !hasAttributes())\
    \ {\n      return s;\n    }\n    State c = s = currentState[0] = new State();\n\
    \    final Iterator<AttributeImpl> it = attributeImpls.values().iterator();\n\
    \    c.attribute = it.next();\n    while (it.hasNext()) {\n      c.next = new\
    \ State();\n      c = c.next;\n      c.attribute = it.next();\n    }\n    return\
    \ s;\n  }\n\n  /**\n   * Resets all Attributes in this AttributeSource by calling\
    \ {@link AttributeImpl#clear()} on each\n   * Attribute implementation.\n   */\n\
    \  public final void clearAttributes() {\n    for (State state = getCurrentState();\
    \ state != null; state = state.next) {\n      state.attribute.clear();\n    }\n\
    \  }\n\n  /**\n   * Resets all Attributes in this AttributeSource by calling {@link\
    \ AttributeImpl#end()} on each\n   * Attribute implementation.\n   */\n  public\
    \ final void endAttributes() {\n    for (State state = getCurrentState(); state\
    \ != null; state = state.next) {\n      state.attribute.end();\n    }\n  }\n\n\
    \  /** Removes all attributes and their implementations from this AttributeSource.\
    \ */\n  public final void removeAllAttributes() {\n    attributes.clear();\n \
    \   attributeImpls.clear();\n  }\n\n  /**\n   * Captures the state of all Attributes.\
    \ The return value can be passed to {@link #restoreState}\n   * to restore the\
    \ state of this or another AttributeSource.\n   *\n   * <p>Be careful, this method\
    \ comes with a cost of deep copying all attributes in the source.\n   */\n  public\
    \ final State captureState() {\n    final State state = this.getCurrentState();\n\
    \    return (state == null) ? null : state.clone();\n  }\n\n  /**\n   * Restores\
    \ this state by copying the values of all attribute implementations that this\
    \ state\n   * contains into the attributes implementations of the targetStream.\
    \ The targetStream must contain\n   * a corresponding instance for each argument\
    \ contained in this state (e.g. it is not possible to\n   * restore the state\
    \ of an AttributeSource containing a TermAttribute into a AttributeSource using\n\
    \   * a Token instance as implementation).\n   *\n   * <p>Note that this method\
    \ does not affect attributes of the targetStream that are not contained\n   *\
    \ in this state. In other words, if for example the targetStream contains an OffsetAttribute,\
    \ but\n   * this state doesn't, then the value of the OffsetAttribute remains\
    \ unchanged. It might be\n   * desirable to reset its value to the default, in\
    \ which case the caller should first call {@link\n   * TokenStream#clearAttributes()}\
    \ on the targetStream.\n   */\n  public final void restoreState(State state) {\n\
    \    if (state == null) return;\n\n    do {\n      AttributeImpl targetImpl =\
    \ attributeImpls.get(state.attribute.getClass());\n      if (targetImpl == null)\
    \ {\n        throw new IllegalArgumentException(\n            \"State contains\
    \ AttributeImpl of type \"\n                + state.attribute.getClass().getName()\n\
    \                + \" that is not in in this AttributeSource\");\n      }\n  \
    \    state.attribute.copyTo(targetImpl);\n      state = state.next;\n    } while\
    \ (state != null);\n  }\n\n  @Override\n  public int hashCode() {\n    int code\
    \ = 0;\n    for (State state = getCurrentState(); state != null; state = state.next)\
    \ {\n      code = code * 31 + state.attribute.hashCode();\n    }\n    return code;\n\
    \  }\n\n  @Override\n  public boolean equals(Object obj) {\n    if (obj == this)\
    \ {\n      return true;\n    }\n\n    if (obj instanceof AttributeSource other)\
    \ {\n      if (hasAttributes()) {\n        if (!other.hasAttributes()) {\n   \
    \       return false;\n        }\n\n        if (this.attributeImpls.size() !=\
    \ other.attributeImpls.size()) {\n          return false;\n        }\n\n     \
    \   // it is only equal if all attribute impls are the same in the same order\n\
    \        State thisState = this.getCurrentState();\n        State otherState =\
    \ other.getCurrentState();\n        while (thisState != null && otherState !=\
    \ null) {\n          if (otherState.attribute.getClass() != thisState.attribute.getClass()\n\
    \              || !otherState.attribute.equals(thisState.attribute)) {\n     \
    \       return false;\n          }\n          thisState = thisState.next;\n  \
    \        otherState = otherState.next;\n        }\n        return true;\n    \
    \  } else {\n        return !other.hasAttributes();\n      }\n    } else {\n \
    \     return false;\n    }\n  }\n\n  /**\n   * This method returns the current\
    \ attribute values as a string in the following format by calling\n   * the {@link\
    \ #reflectWith(AttributeReflector)} method:\n   *\n   * <ul>\n   *   <li><em>iff\
    \ {@code prependAttClass=true}:</em> {@code\n   *       \"AttributeClass#key=value,AttributeClass#key=value\"\
    }\n   *   <li><em>iff {@code prependAttClass=false}:</em> {@code \"key=value,key=value\"\
    }\n   * </ul>\n   *\n   * @see #reflectWith(AttributeReflector)\n   */\n  public\
    \ final String reflectAsString(final boolean prependAttClass) {\n    final StringBuilder\
    \ buffer = new StringBuilder();\n    reflectWith(\n        new AttributeReflector()\
    \ {\n          @Override\n          public void reflect(Class<? extends Attribute>\
    \ attClass, String key, Object value) {\n            if (buffer.length() > 0)\
    \ {\n              buffer.append(',');\n            }\n            if (prependAttClass)\
    \ {\n              buffer.append(attClass.getName()).append('#');\n          \
    \  }\n            buffer.append(key).append('=').append((value == null) ? \"null\"\
    \ : value);\n          }\n        });\n    return buffer.toString();\n  }\n\n\
    \  /**\n   * This method is for introspection of attributes, it should simply\
    \ add the key/values this\n   * AttributeSource holds to the given {@link AttributeReflector}.\n\
    \   *\n   * <p>This method iterates over all Attribute implementations and calls\
    \ the corresponding {@link\n   * AttributeImpl#reflectWith} method.\n   *\n  \
    \ * @see AttributeImpl#reflectWith\n   */\n  public final void reflectWith(AttributeReflector\
    \ reflector) {\n    for (State state = getCurrentState(); state != null; state\
    \ = state.next) {\n      state.attribute.reflectWith(reflector);\n    }\n  }\n\
    \n  /**\n   * Performs a clone of all {@link AttributeImpl} instances returned\
    \ in a new {@code\n   * AttributeSource} instance. This method can be used to\
    \ e.g. create another TokenStream with\n   * exactly the same attributes (using\
    \ {@link #AttributeSource(AttributeSource)}). You can also use\n   * it as a (non-performant)\
    \ replacement for {@link #captureState}, if you need to look into /\n   * modify\
    \ the captured state.\n   */\n  public final AttributeSource cloneAttributes()\
    \ {\n    final AttributeSource clone = new AttributeSource(this.factory);\n\n\
    \    if (hasAttributes()) {\n      // first clone the impls\n      for (State\
    \ state = getCurrentState(); state != null; state = state.next) {\n        clone.attributeImpls.put(state.attribute.getClass(),\
    \ state.attribute.clone());\n      }\n\n      // now the interfaces\n      for\
    \ (Entry<Class<? extends Attribute>, AttributeImpl> entry : this.attributes.entrySet())\
    \ {\n        clone.attributes.put(entry.getKey(), clone.attributeImpls.get(entry.getValue().getClass()));\n\
    \      }\n    }\n\n    return clone;\n  }\n\n  /**\n   * Copies the contents of\
    \ this {@code AttributeSource} to the given target {@code\n   * AttributeSource}.\
    \ The given instance has to provide all {@link Attribute}s this instance\n   *\
    \ contains. The actual attribute implementations must be identical in both {@code\n\
    \   * AttributeSource} instances; ideally both AttributeSource instances should\
    \ use the same {@link\n   * AttributeFactory}. You can use this method as a replacement\
    \ for {@link #restoreState}, if you\n   * use {@link #cloneAttributes} instead\
    \ of {@link #captureState}.\n   */\n  public final void copyTo(AttributeSource\
    \ target) {\n    for (State state = getCurrentState(); state != null; state =\
    \ state.next) {\n      final AttributeImpl targetImpl = target.attributeImpls.get(state.attribute.getClass());\n\
    \      if (targetImpl == null) {\n        throw new IllegalArgumentException(\n\
    \            \"This AttributeSource contains AttributeImpl of type \"\n      \
    \          + state.attribute.getClass().getName()\n                + \" that is\
    \ not in the target\");\n      }\n      state.attribute.copyTo(targetImpl);\n\
    \    }\n  }\n\n  /**\n   * Returns a string consisting of the class's simple name,\
    \ the hex representation of the identity\n   * hash code, and the current reflection\
    \ of all attributes.\n   *\n   * @see #reflectAsString(boolean)\n   */\n  @Override\n\
    \  public String toString() {\n    return getClass().getSimpleName()\n       \
    \ + '@'\n        + Integer.toHexString(System.identityHashCode(this))\n      \
    \  + \" \"\n        + reflectAsString(false);\n  }\n}\n\n### Source File Dependency\

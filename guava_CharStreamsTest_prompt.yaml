- content: "### Task Information\nBased on the source code, write/rewrite tests to\
    \ cover the source code.\nRepository: guava\nSource File Path: guava/src/com/google/common/io/CharStreams.java\n\
    Test File Path: guava-tests/test/com/google/common/io/CharStreamsTest.java\nProject\
    \ Programming Language: Java\nTesting Framework: JUnit\n### Source File Content\n\
    ### Source File Content:\n/*\n * Copyright (C) 2007 The Guava Authors\n *\n *\
    \ Licensed under the Apache License, Version 2.0 (the \"License\"); you may not\
    \ use this file except\n * in compliance with the License. You may obtain a copy\
    \ of the License at\n *\n * http://www.apache.org/licenses/LICENSE-2.0\n *\n *\
    \ Unless required by applicable law or agreed to in writing, software distributed\
    \ under the License\n * is distributed on an \"AS IS\" BASIS, WITHOUT WARRANTIES\
    \ OR CONDITIONS OF ANY KIND, either express\n * or implied. See the License for\
    \ the specific language governing permissions and limitations under\n * the License.\n\
    \ */\n\npackage com.google.common.io;\n\nimport static com.google.common.base.Preconditions.checkNotNull;\n\
    import static com.google.common.base.Preconditions.checkPositionIndexes;\n\nimport\
    \ com.google.common.annotations.GwtIncompatible;\nimport com.google.common.annotations.J2ktIncompatible;\n\
    import com.google.errorprone.annotations.CanIgnoreReturnValue;\nimport java.io.Closeable;\n\
    import java.io.EOFException;\nimport java.io.IOException;\nimport java.io.Reader;\n\
    import java.io.Writer;\nimport java.nio.CharBuffer;\nimport java.util.ArrayList;\n\
    import java.util.List;\nimport org.jspecify.annotations.Nullable;\n\n/**\n * Provides\
    \ utility methods for working with character streams.\n *\n * <p>Some of the methods\
    \ in this class take arguments with a generic type of {@code Readable &\n * Closeable}.\
    \ A {@link java.io.Reader} implements both of those interfaces. Similarly for\
    \ {@code\n * Appendable & Closeable} and {@link java.io.Writer}.\n *\n * @author\
    \ Chris Nokleberg\n * @author Bin Zhu\n * @author Colin Decker\n * @since 1.0\n\
    \ */\n@J2ktIncompatible\n@GwtIncompatible\npublic final class CharStreams {\n\n\
    \  // 2K chars (4K bytes)\n  private static final int DEFAULT_BUF_SIZE = 0x800;\n\
    \n  /** Creates a new {@code CharBuffer} for buffering reads or writes. */\n \
    \ static CharBuffer createBuffer() {\n    return CharBuffer.allocate(DEFAULT_BUF_SIZE);\n\
    \  }\n\n  private CharStreams() {}\n\n  /**\n   * Copies all characters between\
    \ the {@link Readable} and {@link Appendable} objects. Does not\n   * close or\
    \ flush either object.\n   *\n   * @param from the object to read from\n   * @param\
    \ to the object to write to\n   * @return the number of characters copied\n  \
    \ * @throws IOException if an I/O error occurs\n   */\n  @CanIgnoreReturnValue\n\
    \  public static long copy(Readable from, Appendable to) throws IOException {\n\
    \    // The most common case is that from is a Reader (like InputStreamReader\
    \ or StringReader) so\n    // take advantage of that.\n    if (from instanceof\
    \ Reader) {\n      // optimize for common output types which are optimized to\
    \ deal with char[]\n      if (to instanceof StringBuilder) {\n        return copyReaderToBuilder((Reader)\
    \ from, (StringBuilder) to);\n      } else {\n        return copyReaderToWriter((Reader)\
    \ from, asWriter(to));\n      }\n    }\n\n    checkNotNull(from);\n    checkNotNull(to);\n\
    \    long total = 0;\n    CharBuffer buf = createBuffer();\n    while (from.read(buf)\
    \ != -1) {\n      Java8Compatibility.flip(buf);\n      to.append(buf);\n     \
    \ total += buf.remaining();\n      Java8Compatibility.clear(buf);\n    }\n   \
    \ return total;\n  }\n\n  // TODO(lukes): consider allowing callers to pass in\
    \ a buffer to use, some callers would be able\n  // to reuse buffers, others would\
    \ be able to size them more appropriately than the constant\n  // defaults\n\n\
    \  /**\n   * Copies all characters between the {@link Reader} and {@link StringBuilder}\
    \ objects. Does not\n   * close or flush the reader.\n   *\n   * <p>This is identical\
    \ to {@link #copy(Readable, Appendable)} but optimized for these specific\n  \
    \ * types. CharBuffer has poor performance when being written into or read out\
    \ of so round tripping\n   * all the bytes through the buffer takes a long time.\
    \ With these specialized types we can just\n   * use a char array.\n   *\n   *\
    \ @param from the object to read from\n   * @param to the object to write to\n\
    \   * @return the number of characters copied\n   * @throws IOException if an\
    \ I/O error occurs\n   */\n  @CanIgnoreReturnValue\n  static long copyReaderToBuilder(Reader\
    \ from, StringBuilder to) throws IOException {\n    checkNotNull(from);\n    checkNotNull(to);\n\
    \    char[] buf = new char[DEFAULT_BUF_SIZE];\n    int nRead;\n    long total\
    \ = 0;\n    while ((nRead = from.read(buf)) != -1) {\n      to.append(buf, 0,\
    \ nRead);\n      total += nRead;\n    }\n    return total;\n  }\n\n  /**\n   *\
    \ Copies all characters between the {@link Reader} and {@link Writer} objects.\
    \ Does not close or\n   * flush the reader or writer.\n   *\n   * <p>This is identical\
    \ to {@link #copy(Readable, Appendable)} but optimized for these specific\n  \
    \ * types. CharBuffer has poor performance when being written into or read out\
    \ of so round tripping\n   * all the bytes through the buffer takes a long time.\
    \ With these specialized types we can just\n   * use a char array.\n   *\n   *\
    \ @param from the object to read from\n   * @param to the object to write to\n\
    \   * @return the number of characters copied\n   * @throws IOException if an\
    \ I/O error occurs\n   */\n  @CanIgnoreReturnValue\n  static long copyReaderToWriter(Reader\
    \ from, Writer to) throws IOException {\n    checkNotNull(from);\n    checkNotNull(to);\n\
    \    char[] buf = new char[DEFAULT_BUF_SIZE];\n    int nRead;\n    long total\
    \ = 0;\n    while ((nRead = from.read(buf)) != -1) {\n      to.write(buf, 0, nRead);\n\
    \      total += nRead;\n    }\n    return total;\n  }\n\n  /**\n   * Reads all\
    \ characters from a {@link Readable} object into a {@link String}. Does not close\
    \ the\n   * {@code Readable}.\n   *\n   * @param r the object to read from\n \
    \  * @return a string containing all the characters\n   * @throws IOException\
    \ if an I/O error occurs\n   */\n  public static String toString(Readable r) throws\
    \ IOException {\n    return toStringBuilder(r).toString();\n  }\n\n  /**\n   *\
    \ Reads all characters from a {@link Readable} object into a new {@link StringBuilder}\
    \ instance.\n   * Does not close the {@code Readable}.\n   *\n   * @param r the\
    \ object to read from\n   * @return a {@link StringBuilder} containing all the\
    \ characters\n   * @throws IOException if an I/O error occurs\n   */\n  private\
    \ static StringBuilder toStringBuilder(Readable r) throws IOException {\n    StringBuilder\
    \ sb = new StringBuilder();\n    if (r instanceof Reader) {\n      copyReaderToBuilder((Reader)\
    \ r, sb);\n    } else {\n      copy(r, sb);\n    }\n    return sb;\n  }\n\n  /**\n\
    \   * Reads all of the lines from a {@link Readable} object. The lines do not\
    \ include\n   * line-termination characters, but do include other leading and\
    \ trailing whitespace.\n   *\n   * <p>Does not close the {@code Readable}. If\
    \ reading files or resources you should use the {@link\n   * Files#readLines}\
    \ and {@link Resources#readLines} methods.\n   *\n   * @param r the object to\
    \ read from\n   * @return a mutable {@link List} containing all the lines\n  \
    \ * @throws IOException if an I/O error occurs\n   */\n  public static List<String>\
    \ readLines(Readable r) throws IOException {\n    List<String> result = new ArrayList<>();\n\
    \    LineReader lineReader = new LineReader(r);\n    String line;\n    while ((line\
    \ = lineReader.readLine()) != null) {\n      result.add(line);\n    }\n    return\
    \ result;\n  }\n\n  /**\n   * Streams lines from a {@link Readable} object, stopping\
    \ when the processor returns {@code false}\n   * or all lines have been read and\
    \ returning the result produced by the processor. Does not close\n   * {@code\
    \ readable}. Note that this method may not fully consume the contents of {@code\
    \ readable}\n   * if the processor stops processing early.\n   *\n   * @throws\
    \ IOException if an I/O error occurs\n   * @since 14.0\n   */\n  @CanIgnoreReturnValue\
    \ // some processors won't return a useful result\n  @ParametricNullness\n  public\
    \ static <T extends @Nullable Object> T readLines(\n      Readable readable, LineProcessor<T>\
    \ processor) throws IOException {\n    checkNotNull(readable);\n    checkNotNull(processor);\n\
    \n    LineReader lineReader = new LineReader(readable);\n    String line;\n  \
    \  while ((line = lineReader.readLine()) != null) {\n      if (!processor.processLine(line))\
    \ {\n        break;\n      }\n    }\n    return processor.getResult();\n  }\n\n\
    \  /**\n   * Reads and discards data from the given {@code Readable} until the\
    \ end of the stream is reached.\n   * Returns the total number of chars read.\
    \ Does not close the stream.\n   *\n   * @since 20.0\n   */\n  @CanIgnoreReturnValue\n\
    \  public static long exhaust(Readable readable) throws IOException {\n    long\
    \ total = 0;\n    long read;\n    CharBuffer buf = createBuffer();\n    while\
    \ ((read = readable.read(buf)) != -1) {\n      total += read;\n      Java8Compatibility.clear(buf);\n\
    \    }\n    return total;\n  }\n\n  /**\n   * Discards {@code n} characters of\
    \ data from the reader. This method will block until the full\n   * amount has\
    \ been skipped. Does not close the reader.\n   *\n   * @param reader the reader\
    \ to read from\n   * @param n the number of characters to skip\n   * @throws EOFException\
    \ if this stream reaches the end before skipping all the characters\n   * @throws\
    \ IOException if an I/O error occurs\n   */\n  public static void skipFully(Reader\
    \ reader, long n) throws IOException {\n    checkNotNull(reader);\n    while (n\
    \ > 0) {\n      long amt = reader.skip(n);\n      if (amt == 0) {\n        throw\
    \ new EOFException();\n      }\n      n -= amt;\n    }\n  }\n\n  /**\n   * Returns\
    \ a {@link Writer} that simply discards written chars.\n   *\n   * <p><b>Java\
    \ 11+ users:</b> use {@link Writer#nullWriter()} instead. Note that the {@link\n\
    \   * CharStreams} method returns a singleton writer whose {@code close} method\
    \ has no effect, while\n   * the {@link Writer#nullWriter()} method returns a\
    \ new instance whose methods throw after the\n   * instance is {@link Writer#close()\
    \ closed}.\n   *\n   * @since 15.0\n   */\n  public static Writer nullWriter()\
    \ {\n    return NullWriter.INSTANCE;\n  }\n\n  private static final class NullWriter\
    \ extends Writer {\n\n    private static final NullWriter INSTANCE = new NullWriter();\n\
    \n    @Override\n    public void write(int c) {}\n\n    @Override\n    public\
    \ void write(char[] cbuf) {\n      checkNotNull(cbuf);\n    }\n\n    @Override\n\
    \    public void write(char[] cbuf, int off, int len) {\n      checkPositionIndexes(off,\
    \ off + len, cbuf.length);\n    }\n\n    @Override\n    public void write(String\
    \ str) {\n      checkNotNull(str);\n    }\n\n    @Override\n    public void write(String\
    \ str, int off, int len) {\n      checkPositionIndexes(off, off + len, str.length());\n\
    \    }\n\n    @Override\n    public Writer append(@Nullable CharSequence csq)\
    \ {\n      return this;\n    }\n\n    @Override\n    public Writer append(@Nullable\
    \ CharSequence csq, int start, int end) {\n      checkPositionIndexes(start, end,\
    \ csq == null ? \"null\".length() : csq.length());\n      return this;\n    }\n\
    \n    @Override\n    public Writer append(char c) {\n      return this;\n    }\n\
    \n    @Override\n    public void flush() {}\n\n    @Override\n    public void\
    \ close() {}\n\n    @Override\n    public String toString() {\n      return \"\
    CharStreams.nullWriter()\";\n    }\n  }\n\n  /**\n   * Returns a Writer that sends\
    \ all output to the given {@link Appendable} target. Closing the\n   * writer\
    \ will close the target if it is {@link Closeable}, and flushing the writer will\
    \ flush the\n   * target if it is {@link java.io.Flushable}.\n   *\n   * @param\
    \ target the object to which output will be sent\n   * @return a new Writer object,\
    \ unless target is a Writer, in which case the target is returned\n   */\n  public\
    \ static Writer asWriter(Appendable target) {\n    if (target instanceof Writer)\
    \ {\n      return (Writer) target;\n    }\n    return new AppendableWriter(target);\n\
    \  }\n}\n\n### Source File Dependency Files Content\n### Dependency File: GwtIncompatible.java\n\
    /*\n * Copyright (C) 2009 The Guava Authors\n *\n * Licensed under the Apache\
    \ License, Version 2.0 (the \"License\"); you may not use this file except\n *\
    \ in compliance with the License. You may obtain a copy of the License at\n *\n\
    \ * http://www.apache.org/licenses/LICENSE-2.0\n *\n * Unless required by applicable\
    \ law or agreed to in writing, software distributed under the License\n * is distributed\
    \ on an \"AS IS\" BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either\
    \ express\n * or implied. See the License for the specific language governing\
    \ permissions and limitations under\n * the License.\n */\n\npackage com.google.common.annotations;\n\
    \nimport java.lang.annotation.Documented;\nimport java.lang.annotation.ElementType;\n\
    import java.lang.annotation.Retention;\nimport java.lang.annotation.RetentionPolicy;\n\
    import java.lang.annotation.Target;\n\n/**\n * The presence of this annotation\
    \ on an API indicates that the method may <em>not</em> be used with\n * the <a\
    \ href=\"http://www.gwtproject.org/\">Google Web Toolkit</a> (GWT).\n *\n * <p>This\
    \ annotation behaves identically to <a href=\n * \"http://www.gwtproject.org/javadoc/latest/com/google/gwt/core/shared/GwtIncompatible.html\"\
    >the\n * {@code @GwtIncompatible} annotation in GWT itself</a>.\n *\n * @author\
    \ Charles Fry\n */\n@Retention(RetentionPolicy.CLASS)\n@Target({ElementType.TYPE,\
    \ ElementType.METHOD, ElementType.CONSTRUCTOR, ElementType.FIELD})\n@Documented\n\
    @GwtCompatible\npublic @interface GwtIncompatible {\n  /**\n   * Describes why\
    \ the annotated element is incompatible with GWT. Since this is generally due\
    \ to a\n   * dependence on a type/method which GWT doesn't support, it is sufficient\
    \ to simply reference the\n   * unsupported type/method. E.g. \"Class.isInstance\"\
    .\n   *\n   * <p>As of Guava 20.0, this value is optional. We encourage authors\
    \ who wish to describe why an\n   * API is {@code @GwtIncompatible} to instead\
    \ leave an implementation comment.\n   */\n  String value() default \"\";\n}\n\
    \n\n### Dependency File: J2ktIncompatible.java\n/*\n * Copyright (C) 2009 The\
    \ Guava Authors\n *\n * Licensed under the Apache License, Version 2.0 (the \"\
    License\"); you may not use this file except\n * in compliance with the License.\
    \ You may obtain a copy of the License at\n *\n * http://www.apache.org/licenses/LICENSE-2.0\n\
    \ *\n * Unless required by applicable law or agreed to in writing, software distributed\
    \ under the License\n * is distributed on an \"AS IS\" BASIS, WITHOUT WARRANTIES\
    \ OR CONDITIONS OF ANY KIND, either express\n * or implied. See the License for\
    \ the specific language governing permissions and limitations under\n * the License.\n\
    \ */\n\npackage com.google.common.annotations;\n\nimport java.lang.annotation.ElementType;\n\
    import java.lang.annotation.Retention;\nimport java.lang.annotation.RetentionPolicy;\n\
    import java.lang.annotation.Target;\n\n/**\n * The presence of this annotation\
    \ on an API indicates that the method may <em>not</em> be used with\n * J2kt.\n\
    \ *\n * @since 32.0.0\n */\n@Retention(RetentionPolicy.CLASS)\n@Target({ElementType.TYPE,\
    \ ElementType.METHOD, ElementType.CONSTRUCTOR, ElementType.FIELD})\n@GwtCompatible\n\
    public @interface J2ktIncompatible {}\n\nOutput the complete test file, code only,\
    \ no explanations.\n### Time\nCurrent time: 2025-04-11 00:57:51\n"
  role: user

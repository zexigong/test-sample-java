    \ *\n * <p>so that a hypothetical bad caller of this method, such as:\n *\n *\
    \ {@snippet :\n * void exampleBadCaller() {\n *   double d = sqrt(-1.0);\n * }\n\
    \ * }\n *\n * <p>would be flagged as having called {@code sqrt()} with an illegal\
    \ argument.\n *\n * <h3>Performance</h3>\n *\n * <p>Avoid passing message arguments\
    \ that are expensive to compute; your code will always compute\n * them, even\
    \ though they usually won't be needed. If you have such arguments, use the conventional\n\
    \ * if/throw idiom instead.\n *\n * <p>Depending on your message arguments, memory\

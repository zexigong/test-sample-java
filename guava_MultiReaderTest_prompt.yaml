    \ is appropriate to the situation.\n * (The same goes for the message-accepting\
    \ overloads.)\n *\n * <h3>Only {@code %s} is supported</h3>\n *\n * <p>{@code\
    \ Preconditions} uses {@link Strings#lenientFormat} to format error message template\n\

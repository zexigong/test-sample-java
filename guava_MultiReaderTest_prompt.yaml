    \ met).\n *\n * <p>If the precondition is not met, the {@code Preconditions} method\
    \ throws an unchecked exception\n * of a specified type, which helps the method\
    \ in which the exception was thrown communicate that\n * its caller has made a\
    \ mistake. This allows constructs such as\n *\n * {@snippet :\n * public static\
    \ double sqrt(double value) {\n *   if (value < 0) {\n *     throw new IllegalArgumentException(\"\
    input is negative: \" + value);\n *   }\n *   // calculate square root\n * }\n\
    \ * }\n *\n * <p>to be replaced with the more compact\n *\n * {@snippet :\n *\
    \ public static double sqrt(double value) {\n *   checkArgument(value >= 0, \"\

    \ */\n\npackage com.google.common.io;\n\nimport static com.google.common.base.Preconditions.checkNotNull;\n\
    \nimport com.google.common.annotations.GwtIncompatible;\nimport com.google.common.annotations.J2ktIncompatible;\n\
    import com.google.common.base.Preconditions;\nimport java.io.IOException;\nimport\
    \ java.io.Reader;\nimport java.util.Iterator;\nimport org.jspecify.annotations.Nullable;\n\
    \n/**\n * A {@link Reader} that concatenates multiple readers.\n *\n * @author\
    \ Bin Zhu\n * @since 1.0\n */\n@J2ktIncompatible\n@GwtIncompatible\nclass MultiReader\
    \ extends Reader {\n  private final Iterator<? extends CharSource> it;\n  private\
    \ @Nullable Reader current;\n\n  MultiReader(Iterator<? extends CharSource> readers)\
    \ throws IOException {\n    this.it = readers;\n    advance();\n  }\n\n  /** Closes\
    \ the current reader and opens the next one, if any. */\n  private void advance()\
    \ throws IOException {\n    close();\n    if (it.hasNext()) {\n      current =\
    \ it.next().openStream();\n    }\n  }\n\n  @Override\n  public int read(char[]\
    \ cbuf, int off, int len) throws IOException {\n    checkNotNull(cbuf);\n    if\
    \ (current == null) {\n      return -1;\n    }\n    int result = current.read(cbuf,\
    \ off, len);\n    if (result == -1) {\n      advance();\n      return read(cbuf,\
    \ off, len);\n    }\n    return result;\n  }\n\n  @Override\n  public long skip(long\
    \ n) throws IOException {\n    Preconditions.checkArgument(n >= 0, \"n is negative\"\
    );\n    if (n > 0) {\n      while (current != null) {\n        long result = current.skip(n);\n\
    \        if (result > 0) {\n          return result;\n        }\n        advance();\n\
    \      }\n    }\n    return 0;\n  }\n\n  @Override\n  public boolean ready() throws\
    \ IOException {\n    return (current != null) && current.ready();\n  }\n\n  @Override\n\
    \  public void close() throws IOException {\n    if (current != null) {\n    \
    \  try {\n        current.close();\n      } finally {\n        current = null;\n\
    \      }\n    }\n  }\n}\n\n### Source File Dependency Files Content\n### Dependency\

- content: "### Task Information\nBased on the source code, write/rewrite tests to\
    \ cover the source code.\nRepository: checkstyle\nSource File Path: src/main/java/com/puppycrawl/tools/checkstyle/api/FileText.java\n\
    Test File Path: src/test/java/com/puppycrawl/tools/checkstyle/api/FileTextTest.java\n\
    Project Programming Language: Java\nTesting Framework: JUnit\n### Source File\
    \ Content\n### Source File Content:\n///////////////////////////////////////////////////////////////////////////////////////////////\n\
    // checkstyle: Checks Java source code and other text files for adherence to a\
    \ set of rules.\n// Copyright (C) 2001-2025 the original author or authors.\n\
    //\n// This library is free software; you can redistribute it and/or\n// modify\
    \ it under the terms of the GNU Lesser General Public\n// License as published\
    \ by the Free Software Foundation; either\n// version 2.1 of the License, or (at\
    \ your option) any later version.\n//\n// This library is distributed in the hope\
    \ that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied\
    \ warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the\
    \ GNU\n// Lesser General Public License for more details.\n//\n// You should have\
    \ received a copy of the GNU Lesser General Public\n// License along with this\
    \ library; if not, write to the Free Software\n// Foundation, Inc., 59 Temple\
    \ Place, Suite 330, Boston, MA  02111-1307  USA\n///////////////////////////////////////////////////////////////////////////////////////////////\n\
    \npackage com.puppycrawl.tools.checkstyle.api;\n\nimport java.io.BufferedReader;\n\
    import java.io.File;\nimport java.io.FileNotFoundException;\nimport java.io.IOException;\n\
    import java.io.InputStream;\nimport java.io.InputStreamReader;\nimport java.io.Reader;\n\
    import java.io.StringReader;\nimport java.nio.charset.Charset;\nimport java.nio.charset.CharsetDecoder;\n\
    import java.nio.charset.CodingErrorAction;\nimport java.nio.charset.UnsupportedCharsetException;\n\
    import java.nio.file.Files;\nimport java.util.ArrayList;\nimport java.util.Arrays;\n\
    import java.util.List;\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\
    \nimport com.puppycrawl.tools.checkstyle.utils.CommonUtil;\n\n/**\n * Represents\
    \ the text contents of a file of arbitrary plain text type.\n *\n * <p>\n * This\
    \ class will be passed to instances of class FileSetCheck by\n * Checker.\n *\
    \ </p>\n *\n */\npublic final class FileText {\n\n    /**\n     * The number of\
    \ characters to read in one go.\n     */\n    private static final int READ_BUFFER_SIZE\
    \ = 1024;\n\n    /**\n     * Regular expression pattern matching all line terminators.\n\
    \     */\n    private static final Pattern LINE_TERMINATOR = Pattern.compile(\"\
    \\\\n|\\\\r\\\\n?\");\n\n    // For now, we always keep both full text and lines\
    \ array.\n    // In the long run, however, the one passed at initialization might\
    \ be\n    // enough, while the other could be lazily created when requested.\n\
    \    // This would save memory but cost CPU cycles.\n\n    /**\n     * The name\
    \ of the file.\n     * {@code null} if no file name is available for whatever\
    \ reason.\n     */\n    private final File file;\n\n    /**\n     * The charset\
    \ used to read the file.\n     * {@code null} if the file was reconstructed from\
    \ a list of lines.\n     */\n    private final Charset charset;\n\n    /**\n \
    \    * The lines of the file, without terminators.\n     */\n    private final\
    \ String[] lines;\n\n    /**\n     * The full text contents of the file.\n   \
    \  *\n     * @noinspection FieldMayBeFinal\n     * @noinspectionreason FieldMayBeFinal\
    \ - field is not final to ease reaching full test coverage.\n     */\n    private\
    \ String fullText;\n\n    /**\n     * The first position of each line within the\
    \ full text.\n     */\n    private int[] lineBreaks;\n\n    /**\n     * Copy constructor.\n\
    \     *\n     * @param fileText to make copy of\n     */\n    public FileText(FileText\
    \ fileText) {\n        file = fileText.file;\n        charset = fileText.charset;\n\
    \        fullText = fileText.fullText;\n        lines = fileText.lines.clone();\n\
    \        if (fileText.lineBreaks != null) {\n            lineBreaks = fileText.lineBreaks.clone();\n\
    \        }\n    }\n\n    /**\n     * Compatibility constructor.\n     *\n    \
    \ * <p>This constructor reconstructs the text of the file by joining\n     * lines\
    \ with linefeed characters. This process does not restore\n     * the original\
    \ line terminators and should therefore be avoided.\n     *\n     * @param file\
    \ the name of the file\n     * @param lines the lines of the text, without terminators\n\
    \     * @throws NullPointerException if the lines array is null\n     */\n   \
    \ public FileText(File file, List<String> lines) {\n        final StringBuilder\
    \ buf = new StringBuilder(1024);\n        for (final String line : lines) {\n\
    \            buf.append(line).append('\\n');\n        }\n\n        this.file =\
    \ file;\n        charset = null;\n        fullText = buf.toString();\n       \
    \ this.lines = lines.toArray(CommonUtil.EMPTY_STRING_ARRAY);\n    }\n\n    /**\n\
    \     * Creates a new file text representation.\n     *\n     * <p>The file will\
    \ be read using the specified encoding, replacing\n     * malformed input and\
    \ unmappable characters with the default\n     * replacement character.\n    \
    \ *\n     * @param file the name of the file\n     * @param charsetName the encoding\
    \ to use when reading the file\n     * @throws NullPointerException if the text\
    \ is null\n     * @throws IllegalStateException if the charset is not supported.\n\
    \     * @throws IOException if the file could not be read\n     */\n    public\
    \ FileText(File file, String charsetName) throws IOException {\n        this.file\
    \ = file;\n\n        // We use our own decoder, to be sure we have complete control\n\
    \        // about replacements.\n        final CharsetDecoder decoder;\n     \
    \   try {\n            charset = Charset.forName(charsetName);\n            decoder\
    \ = charset.newDecoder();\n            decoder.onMalformedInput(CodingErrorAction.REPLACE);\n\
    \            decoder.onUnmappableCharacter(CodingErrorAction.REPLACE);\n     \
    \   }\n        catch (final UnsupportedCharsetException ex) {\n            final\
    \ String message = \"Unsupported charset: \" + charsetName;\n            throw\
    \ new IllegalStateException(message, ex);\n        }\n\n        fullText = readFile(file,\
    \ decoder);\n\n        // Use the BufferedReader to break down the lines as this\n\
    \        // is about 30% faster than using the\n        // LINE_TERMINATOR.split(fullText,\
    \ -1) method\n        try (BufferedReader reader = new BufferedReader(new StringReader(fullText)))\
    \ {\n            final ArrayList<String> textLines = new ArrayList<>();\n    \
    \        while (true) {\n                final String line = reader.readLine();\n\
    \                if (line == null) {\n                    break;\n           \
    \     }\n                textLines.add(line);\n            }\n            lines\
    \ = textLines.toArray(CommonUtil.EMPTY_STRING_ARRAY);\n        }\n    }\n\n  \
    \  /**\n     * Reads file using specific decoder and returns all its content as\
    \ a String.\n     *\n     * @param inputFile File to read\n     * @param decoder\
    \ Charset decoder\n     * @return File's text\n     * @throws IOException Unable\
    \ to open or read the file\n     * @throws FileNotFoundException when inputFile\
    \ does not exist\n     */\n    private static String readFile(final File inputFile,\
    \ final CharsetDecoder decoder)\n            throws IOException {\n        if\
    \ (!inputFile.exists()) {\n            throw new FileNotFoundException(inputFile.getPath()\
    \ + \" (No such file or directory)\");\n        }\n        final StringBuilder\
    \ buf = new StringBuilder(1024);\n        final InputStream stream = Files.newInputStream(inputFile.toPath());\n\
    \        try (Reader reader = new InputStreamReader(stream, decoder)) {\n    \
    \        final char[] chars = new char[READ_BUFFER_SIZE];\n            while (true)\
    \ {\n                final int len = reader.read(chars);\n                if (len\
    \ == -1) {\n                    break;\n                }\n                buf.append(chars,\
    \ 0, len);\n            }\n        }\n        return buf.toString();\n    }\n\n\
    \    /**\n     * Retrieves a line of the text by its number.\n     * The returned\
    \ line will not contain a trailing terminator.\n     *\n     * @param lineNo the\
    \ number of the line to get, starting at zero\n     * @return the line with the\
    \ given number\n     */\n    public String get(final int lineNo) {\n        return\
    \ lines[lineNo];\n    }\n\n    /**\n     * Get the name of the file.\n     *\n\
    \     * @return an object containing the name of the file\n     */\n    public\
    \ File getFile() {\n        return file;\n    }\n\n    /**\n     * Get the character\
    \ set which was used to read the file.\n     * Will be {@code null} for a file\
    \ reconstructed from its lines.\n     *\n     * @return the charset used when\
    \ the file was read\n     */\n    public Charset getCharset() {\n        return\
    \ charset;\n    }\n\n    /**\n     * Retrieve the full text of the file.\n   \
    \  *\n     * @return the full text of the file\n     */\n    public CharSequence\
    \ getFullText() {\n        return fullText;\n    }\n\n    /**\n     * Returns\
    \ an array of all lines.\n     * {@code text.toLinesArray()} is equivalent to\n\
    \     * {@code text.toArray(new String[text.size()])}.\n     *\n     * @return\
    \ an array of all lines of the text\n     */\n    public String[] toLinesArray()\
    \ {\n        return lines.clone();\n    }\n\n    /**\n     * Determine line and\
    \ column numbers in full text.\n     *\n     * @param pos the character position\
    \ in the full text\n     * @return the line and column numbers of this character\n\
    \     */\n    public LineColumn lineColumn(int pos) {\n        final int[] lineBreakPositions\
    \ = findLineBreaks();\n        int lineNo = Arrays.binarySearch(lineBreakPositions,\
    \ pos);\n        if (lineNo < 0) {\n            // we have: lineNo = -(insertion\
    \ point) - 1\n            // we want: lineNo =  (insertion point) - 1\n      \
    \      lineNo = -lineNo - 2;\n        }\n        final int startOfLine = lineBreakPositions[lineNo];\n\
    \        final int columnNo = pos - startOfLine;\n        // now we have lineNo\
    \ and columnNo, both starting at zero.\n        return new LineColumn(lineNo +\
    \ 1, columnNo);\n    }\n\n    /**\n     * Find positions of line breaks in the\
    \ full text.\n     *\n     * @return an array giving the first positions of each\
    \ line.\n     */\n    private int[] findLineBreaks() {\n        if (lineBreaks\
    \ == null) {\n            final int[] lineBreakPositions = new int[size() + 1];\n\
    \            lineBreakPositions[0] = 0;\n            int lineNo = 1;\n       \
    \     final Matcher matcher = LINE_TERMINATOR.matcher(fullText);\n           \
    \ while (matcher.find()) {\n                lineBreakPositions[lineNo] = matcher.end();\n\
    \                lineNo++;\n            }\n            if (lineNo < lineBreakPositions.length)\
    \ {\n                lineBreakPositions[lineNo] = fullText.length();\n       \
    \     }\n            lineBreaks = lineBreakPositions;\n        }\n        return\
    \ lineBreaks;\n    }\n\n    /**\n     * Counts the lines of the text.\n     *\n\
    \     * @return the number of lines in the text\n     */\n    public int size()\
    \ {\n        return lines.length;\n    }\n\n}\n\n### Source File Dependency Files\
    \ Content\n### Dependency File: CommonUtil.java\n///////////////////////////////////////////////////////////////////////////////////////////////\n\
    // checkstyle: Checks Java source code and other text files for adherence to a\
    \ set of rules.\n// Copyright (C) 2001-2025 the original author or authors.\n\
    //\n// This library is free software; you can redistribute it and/or\n// modify\
    \ it under the terms of the GNU Lesser General Public\n// License as published\
    \ by the Free Software Foundation; either\n// version 2.1 of the License, or (at\
    \ your option) any later version.\n//\n// This library is distributed in the hope\
    \ that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied\
    \ warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the\
    \ GNU\n// Lesser General Public License for more details.\n//\n// You should have\
    \ received a copy of the GNU Lesser General Public\n// License along with this\
    \ library; if not, write to the Free Software\n// Foundation, Inc., 59 Temple\
    \ Place, Suite 330, Boston, MA  02111-1307  USA\n///////////////////////////////////////////////////////////////////////////////////////////////\n\
    \npackage com.puppycrawl.tools.checkstyle.utils;\n\nimport java.io.Closeable;\n\
    import java.io.File;\nimport java.io.IOException;\nimport java.lang.reflect.Constructor;\n\
    import java.lang.reflect.InvocationTargetException;\nimport java.net.MalformedURLException;\n\
    import java.net.URI;\nimport java.net.URISyntaxException;\nimport java.net.URL;\n\
    import java.nio.file.Path;\nimport java.nio.file.Paths;\nimport java.util.BitSet;\n\
    import java.util.Objects;\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\
    import java.util.regex.PatternSyntaxException;\n\nimport org.xml.sax.InputSource;\n\
    \nimport com.puppycrawl.tools.checkstyle.api.CheckstyleException;\n\n/**\n * Contains\
    \ utility methods.\n *\n */\npublic final class CommonUtil {\n\n    /** Default\
    \ tab width for column reporting. */\n    public static final int DEFAULT_TAB_WIDTH\
    \ = 8;\n\n    /** For cases where no tokens should be accepted. */\n    public\
    \ static final BitSet EMPTY_BIT_SET = new BitSet();\n    /** Copied from org.apache.commons.lang3.ArrayUtils.\
    \ */\n    public static final String[] EMPTY_STRING_ARRAY = new String[0];\n \
    \   /** Copied from org.apache.commons.lang3.ArrayUtils. */\n    public static\
    \ final Integer[] EMPTY_INTEGER_OBJECT_ARRAY = new Integer[0];\n    /** Copied\
    \ from org.apache.commons.lang3.ArrayUtils. */\n    public static final Object[]\
    \ EMPTY_OBJECT_ARRAY = new Object[0];\n    /** Copied from org.apache.commons.lang3.ArrayUtils.\
    \ */\n    public static final int[] EMPTY_INT_ARRAY = new int[0];\n    /** Copied\
    \ from org.apache.commons.lang3.ArrayUtils. */\n    public static final byte[]\
    \ EMPTY_BYTE_ARRAY = new byte[0];\n    /** Copied from org.apache.commons.lang3.ArrayUtils.\
    \ */\n    public static final double[] EMPTY_DOUBLE_ARRAY = new double[0];\n \
    \   /** Pseudo URL protocol for loading from the class path. */\n    public static\
    \ final String CLASSPATH_URL_PROTOCOL = \"classpath:\";\n\n    /** Prefix for\
    \ the exception when unable to find resource. */\n    private static final String\
    \ UNABLE_TO_FIND_EXCEPTION_PREFIX = \"Unable to find: \";\n\n    /** The extension\
    \ separator. */\n    private static final String EXTENSION_SEPARATOR = \".\";\n\
    \n    /** Stop instances being created. **/\n    private CommonUtil() {\n    }\n\
    \n    /**\n     * Helper method to create a regular expression.\n     *\n    \
    \ * @param pattern\n     *            the pattern to match\n     * @return a created\
    \ regexp object\n     * @throws IllegalArgumentException\n     *             if\
    \ unable to create Pattern object.\n     **/\n    public static Pattern createPattern(String\
    \ pattern) {\n        return createPattern(pattern, 0);\n    }\n\n    /**\n  \
    \   * Helper method to create a regular expression with a specific flags.\n  \
    \   *\n     * @param pattern\n     *            the pattern to match\n     * @param\
    \ flags\n     *            the flags to set\n     * @return a created regexp object\n\
    \     * @throws IllegalArgumentException\n     *             if unable to create\
    \ Pattern object.\n     **/\n    public static Pattern createPattern(String pattern,\
    \ int flags) {\n        try {\n            return Pattern.compile(pattern, flags);\n\
    \        }\n        catch (final PatternSyntaxException ex) {\n            throw\
    \ new IllegalArgumentException(\n                \"Failed to initialise regular\
    \ expression \" + pattern, ex);\n        }\n    }\n\n    /**\n     * Returns whether\
    \ the file extension matches what we are meant to process.\n     *\n     * @param\
    \ file\n     *            the file to be checked.\n     * @param fileExtensions\n\
    \     *            files extensions, empty property in config makes it matches\
    \ to all.\n     * @return whether there is a match.\n     */\n    public static\
    \ boolean matchesFileExtension(File file, String... fileExtensions) {\n      \
    \  boolean result = false;\n        if (fileExtensions == null || fileExtensions.length\
    \ == 0) {\n            result = true;\n        }\n        else {\n           \
    \ // normalize extensions so all of them have a leading dot\n            final\
    \ String[] withDotExtensions = new String[fileExtensions.length];\n          \
    \  for (int i = 0; i < fileExtensions.length; i++) {\n                final String\
    \ extension = fileExtensions[i];\n                if (extension.startsWith(EXTENSION_SEPARATOR))\
    \ {\n                    withDotExtensions[i] = extension;\n                }\n\
    \                else {\n                    withDotExtensions[i] = EXTENSION_SEPARATOR\
    \ + extension;\n                }\n            }\n\n            final String fileName\
    \ = file.getName();\n            for (final String fileExtension : withDotExtensions)\
    \ {\n                if (fileName.endsWith(fileExtension)) {\n               \
    \     result = true;\n                    break;\n                }\n        \
    \    }\n        }\n\n        return result;\n    }\n\n    /**\n     * Returns\
    \ whether the specified string contains only whitespace up to the specified index.\n\
    \     *\n     * @param index\n     *            index to check up to\n     * @param\
    \ line\n     *            the line to check\n     * @return whether there is only\
    \ whitespace\n     */\n    public static boolean hasWhitespaceBefore(int index,\
    \ String line) {\n        boolean result = true;\n        for (int i = 0; i <\
    \ index; i++) {\n            if (!Character.isWhitespace(line.charAt(i))) {\n\
    \                result = false;\n                break;\n            }\n    \
    \    }\n        return result;\n    }\n\n    /**\n     * Returns the length of\
    \ a string ignoring all trailing whitespace.\n     * It is a pity that there is\
    \ not a trim() like\n     * method that only removed the trailing whitespace.\n\
    \     *\n     * @param line\n     *            the string to process\n     * @return\
    \ the length of the string ignoring all trailing whitespace\n     **/\n    public\
    \ static int lengthMinusTrailingWhitespace(String line) {\n        int len = line.length();\n\
    \        for (int i = len - 1; i >= 0; i--) {\n            if (!Character.isWhitespace(line.charAt(i)))\
    \ {\n                break;\n            }\n            len--;\n        }\n  \
    \      return len;\n    }\n\n    /**\n     * Returns the length of a String prefix\
    \ with tabs expanded.\n     * Each tab is counted as the number of characters\
    \ is\n     * takes to jump to the next tab stop.\n     *\n     * @param inputString\n\
    \     *            the input String\n     * @param toIdx\n     *            index\
    \ in string (exclusive) where the calculation stops\n     * @param tabWidth\n\
    \     *            the distance between tab stop position.\n     * @return the\
    \ length of string.substring(0, toIdx) with tabs expanded.\n     */\n    public\
    \ static int lengthExpandedTabs(String inputString,\n            int toIdx,\n\
    \            int tabWidth) {\n        int len = 0;\n        for (int idx = 0;\
    \ idx < toIdx; idx++) {\n            if (inputString.codePointAt(idx) == '\\t')\
    \ {\n                len = (len / tabWidth + 1) * tabWidth;\n            }\n \
    \           else {\n                len++;\n            }\n        }\n       \
    \ return len;\n    }\n\n    /**\n     * Validates whether passed string is a valid\
    \ pattern or not.\n     *\n     * @param pattern\n     *            string to\
    \ validate\n     * @return true if the pattern is valid false otherwise\n    \
    \ */\n    public static boolean isPatternValid(String pattern) {\n        boolean\
    \ isValid = true;\n        try {\n            Pattern.compile(pattern);\n    \
    \    }\n        catch (final PatternSyntaxException ignored) {\n            isValid\
    \ = false;\n        }\n        return isValid;\n    }\n\n    /**\n     * Returns\
    \ base class name from qualified name.\n     *\n     * @param type\n     *   \
    \         the fully qualified name. Cannot be null\n     * @return the base class\
    \ name from a fully qualified name\n     */\n    public static String baseClassName(String\
    \ type) {\n        final int index = type.lastIndexOf('.');\n        return type.substring(index\
    \ + 1);\n    }\n\n    /**\n     * Constructs a relative path between base directory\
    \ and a given path.\n     *\n     * @param baseDirectory\n     *            the\
    \ base path to which given path is relativized\n     * @param path\n     *   \
    \         the path to relativize against base directory\n     * @return the relative\
    \ normalized path between base directory and\n     *     path or path if base\
    \ directory is null.\n     */\n    public static String relativizePath(final String\
    \ baseDirectory, final String path) {\n        final String resultPath;\n    \
    \    if (baseDirectory == null) {\n            resultPath = path;\n        }\n\
    \        else {\n            final Path pathAbsolute = Path.of(path);\n      \
    \      final Path pathBase = Path.of(baseDirectory);\n            resultPath =\
    \ pathBase.relativize(pathAbsolute).toString();\n        }\n        return resultPath;\n\
    \    }\n\n    /**\n     * Gets constructor of targetClass.\n     *\n     * @param\
    \ <T> type of the target class object.\n     * @param targetClass\n     *    \
    \        from which constructor is returned\n     * @param parameterTypes\n  \
    \   *            of constructor\n     * @return constructor of targetClass\n \
    \    * @throws IllegalStateException if any exception occurs\n     * @see Class#getConstructor(Class[])\n\
    \     */\n    public static <T> Constructor<T> getConstructor(Class<T> targetClass,\n\
    \                                                    Class<?>... parameterTypes)\
    \ {\n        try {\n            return targetClass.getConstructor(parameterTypes);\n\
    \        }\n        catch (NoSuchMethodException ex) {\n            throw new\
    \ IllegalStateException(ex);\n        }\n    }\n\n    /**\n     * Returns new\
    \ instance of a class.\n     *\n     * @param <T>\n     *            type of constructor\n\
    \     * @param constructor\n     *            to invoke\n     * @param parameters\n\
    \     *            to pass to constructor\n     * @return new instance of class\n\
    \     * @throws IllegalStateException if any exception occurs\n     * @see Constructor#newInstance(Object...)\n\
    \     */\n    public static <T> T invokeConstructor(Constructor<T> constructor,\
    \ Object... parameters) {\n        try {\n            return constructor.newInstance(parameters);\n\
    \        }\n        catch (InstantiationException | IllegalAccessException | InvocationTargetException\
    \ ex) {\n            throw new IllegalStateException(ex);\n        }\n    }\n\n\
    \    /**\n     * Closes a stream re-throwing IOException as IllegalStateException.\n\
    \     *\n     * @param closeable\n     *            Closeable object\n     * @throws\
    \ IllegalStateException when any IOException occurs\n     */\n    public static\
    \ void close(Closeable closeable) {\n        if (closeable != null) {\n      \
    \      try {\n                closeable.close();\n            }\n            catch\
    \ (IOException ex) {\n                throw new IllegalStateException(\"Cannot\
    \ close the stream\", ex);\n            }\n        }\n    }\n\n    /**\n     *\
    \ Creates an input source from a file.\n     *\n     * @param filename name of\
    \ the file.\n     * @return input source.\n     * @throws CheckstyleException\
    \ if an error occurs.\n     */\n    public static InputSource sourceFromFilename(String\
    \ filename) throws CheckstyleException {\n        // figure out if this is a File\
    \ or a URL\n        final URI uri = getUriByFilename(filename);\n        return\
    \ new InputSource(uri.toASCIIString());\n    }\n\n    /**\n     * Resolve the\
    \ specified filename to a URI.\n     *\n     * @param filename name of the file\n\
    \     * @return resolved file URI\n     * @throws CheckstyleException on failure\n\
    \     */\n    public static URI getUriByFilename(String filename) throws CheckstyleException\
    \ {\n        URI uri = getWebOrFileProtocolUri(filename);\n\n        if (uri ==\
    \ null) {\n            uri = getFilepathOrClasspathUri(filename);\n        }\n\
    \n        return uri;\n    }\n\n    /**\n     * Resolves the specified filename\
    \ containing 'http', 'https', 'ftp',\n     * and 'file' protocols (or any RFC\
    \ 2396 compliant URL) to a URI.\n     *\n     * @param filename name of the file\n\
    \     * @return resolved file URI or null if URL is malformed or non-existent\n\
    \     */\n    public static URI getWebOrFileProtocolUri(String filename) {\n \
    \       URI uri;\n        try {\n            final URL url = new URL(filename);\n\
    \            uri = url.toURI();\n        }\n        catch (URISyntaxException\
    \ | MalformedURLException ignored) {\n            uri = null;\n        }\n   \
    \     return uri;\n    }\n\n    /**\n     * Resolves the specified local filename,\
    \ possibly with 'classpath:'\n     * protocol, to a URI.  First we attempt to\
    \ create a new file with\n     * given filename, then attempt to load file from\
    \ class path.\n     *\n     * @param filename name of the file\n     * @return\
    \ resolved file URI\n     * @throws CheckstyleException on failure\n     */\n\

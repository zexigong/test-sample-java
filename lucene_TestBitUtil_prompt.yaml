- content: "### Task Information\nBased on the source code, write/rewrite tests to\
    \ cover the source code.\nRepository: lucene\nSource File Path: lucene/core/src/java/org/apache/lucene/util/BitUtil.java\n\
    Test File Path: lucene/core/src/test/org/apache/lucene/util/TestBitUtil.java\n\
    Project Programming Language: Java\nTesting Framework: JUnit\n### Source File\
    \ Content\n### Source File Content:\n/*\n * Licensed to the Apache Software Foundation\
    \ (ASF) under one or more\n * contributor license agreements.  See the NOTICE\
    \ file distributed with\n * this work for additional information regarding copyright\
    \ ownership.\n * The ASF licenses this file to You under the Apache License, Version\
    \ 2.0\n * (the \"License\"); you may not use this file except in compliance with\n\
    \ * the License.  You may obtain a copy of the License at\n *\n *     http://www.apache.org/licenses/LICENSE-2.0\n\
    \ *\n * Unless required by applicable law or agreed to in writing, software\n\
    \ * distributed under the License is distributed on an \"AS IS\" BASIS,\n * WITHOUT\
    \ WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n * See the\
    \ License for the specific language governing permissions and\n * limitations\
    \ under the License.\n */\npackage org.apache.lucene.util; // from org.apache.solr.util\
    \ rev 555343\n\nimport java.lang.invoke.MethodHandles;\nimport java.lang.invoke.VarHandle;\n\
    import java.nio.ByteOrder;\n\n/**\n * A variety of high efficiency bit twiddling\
    \ routines and encoders for primitives.\n *\n * @lucene.internal\n */\npublic\
    \ final class BitUtil {\n\n  private BitUtil() {} // no instance\n\n  /**\n  \
    \ * Native byte order.\n   *\n   * <p>Warning: This constant is {@link ByteOrder#nativeOrder()}\
    \ only in production environments,\n   * during testing we randomize it. If you\
    \ need to communicate with native APIs (e.g., Java's\n   * Panama API), use {@link\
    \ ByteOrder#nativeOrder()}.\n   */\n  public static final ByteOrder NATIVE_BYTE_ORDER\
    \ = getNativeByteOrder();\n\n  private static ByteOrder getNativeByteOrder() {\n\
    \    try {\n      var prop = System.getProperty(\"tests.seed\");\n      if (prop\
    \ != null) {\n        return (prop.hashCode() % 2 == 0) ? ByteOrder.LITTLE_ENDIAN\
    \ : ByteOrder.BIG_ENDIAN;\n      }\n    } catch (\n        @SuppressWarnings(\"\
    unused\")\n        SecurityException se) {\n      // fall-through\n    }\n   \
    \ return ByteOrder.nativeOrder();\n  }\n\n  /**\n   * A {@link VarHandle} to read/write\
    \ little endian {@code short} from/to a byte array. Shape:\n   * {@code short\
    \ vh.get(byte[] arr, int ofs)} and {@code void vh.set(byte[] arr, int ofs, short\n\
    \   * val)}\n   */\n  public static final VarHandle VH_LE_SHORT =\n      MethodHandles.byteArrayViewVarHandle(short[].class,\
    \ ByteOrder.LITTLE_ENDIAN);\n\n  /**\n   * A {@link VarHandle} to read/write little\
    \ endian {@code int} from a byte array. Shape: {@code\n   * int vh.get(byte[]\
    \ arr, int ofs)} and {@code void vh.set(byte[] arr, int ofs, int val)}\n   */\n\
    \  public static final VarHandle VH_LE_INT =\n      MethodHandles.byteArrayViewVarHandle(int[].class,\
    \ ByteOrder.LITTLE_ENDIAN);\n\n  /**\n   * A {@link VarHandle} to read/write little\
    \ endian {@code long} from a byte array. Shape: {@code\n   * long vh.get(byte[]\
    \ arr, int ofs)} and {@code void vh.set(byte[] arr, int ofs, long val)}\n   */\n\
    \  public static final VarHandle VH_LE_LONG =\n      MethodHandles.byteArrayViewVarHandle(long[].class,\
    \ ByteOrder.LITTLE_ENDIAN);\n\n  /**\n   * A {@link VarHandle} to read/write little\
    \ endian {@code float} from a byte array. Shape: {@code\n   * float vh.get(byte[]\
    \ arr, int ofs)} and {@code void vh.set(byte[] arr, int ofs, float val)}\n   */\n\
    \  public static final VarHandle VH_LE_FLOAT =\n      MethodHandles.byteArrayViewVarHandle(float[].class,\
    \ ByteOrder.LITTLE_ENDIAN);\n\n  /**\n   * A {@link VarHandle} to read/write little\
    \ endian {@code double} from a byte array. Shape: {@code\n   * double vh.get(byte[]\
    \ arr, int ofs)} and {@code void vh.set(byte[] arr, int ofs, double val)}\n  \
    \ */\n  public static final VarHandle VH_LE_DOUBLE =\n      MethodHandles.byteArrayViewVarHandle(double[].class,\
    \ ByteOrder.LITTLE_ENDIAN);\n\n  /**\n   * A {@link VarHandle} to read/write native\
    \ endian {@code short} from/to a byte array. Shape:\n   * {@code short vh.get(byte[]\
    \ arr, int ofs)} and {@code void vh.set(byte[] arr, int ofs, short\n   * val)}\n\
    \   *\n   * <p>Warning: This handle uses default order only in production environments,\
    \ during testing we\n   * randomize it. If you need to communicate with native\
    \ APIs (e.g., Java's Panama API), use {@link\n   * ByteOrder#nativeOrder()}.\n\
    \   */\n  public static final VarHandle VH_NATIVE_SHORT =\n      MethodHandles.byteArrayViewVarHandle(short[].class,\
    \ NATIVE_BYTE_ORDER);\n\n  /**\n   * A {@link VarHandle} to read/write native\
    \ endian {@code int} from a byte array. Shape: {@code\n   * int vh.get(byte[]\
    \ arr, int ofs)} and {@code void vh.set(byte[] arr, int ofs, int val)}\n   *\n\
    \   * <p>Warning: This handle uses default order only in production environments,\
    \ during testing we\n   * randomize it. If you need to communicate with native\
    \ APIs (e.g., Java's Panama API), use {@link\n   * ByteOrder#nativeOrder()}.\n\
    \   */\n  public static final VarHandle VH_NATIVE_INT =\n      MethodHandles.byteArrayViewVarHandle(int[].class,\
    \ NATIVE_BYTE_ORDER);\n\n  /**\n   * A {@link VarHandle} to read/write native\
    \ endian {@code long} from a byte array. Shape: {@code\n   * long vh.get(byte[]\
    \ arr, int ofs)} and {@code void vh.set(byte[] arr, int ofs, long val)}\n   *\n\
    \   * <p>Warning: This handle uses default order only in production environments,\
    \ during testing we\n   * randomize it. If you need to communicate with native\
    \ APIs (e.g., Java's Panama API), use {@link\n   * ByteOrder#nativeOrder()}.\n\
    \   */\n  public static final VarHandle VH_NATIVE_LONG =\n      MethodHandles.byteArrayViewVarHandle(long[].class,\
    \ NATIVE_BYTE_ORDER);\n\n  /**\n   * A {@link VarHandle} to read/write native\
    \ endian {@code float} from a byte array. Shape: {@code\n   * float vh.get(byte[]\
    \ arr, int ofs)} and {@code void vh.set(byte[] arr, int ofs, float val)}\n   *\n\
    \   * <p>Warning: This handle uses default order only in production environments,\
    \ during testing we\n   * randomize it. If you need to communicate with native\
    \ APIs (e.g., Java's Panama API), use {@link\n   * ByteOrder#nativeOrder()}.\n\
    \   */\n  public static final VarHandle VH_NATIVE_FLOAT =\n      MethodHandles.byteArrayViewVarHandle(float[].class,\
    \ NATIVE_BYTE_ORDER);\n\n  /**\n   * A {@link VarHandle} to read/write native\
    \ endian {@code double} from a byte array. Shape: {@code\n   * double vh.get(byte[]\
    \ arr, int ofs)} and {@code void vh.set(byte[] arr, int ofs, double val)}\n  \
    \ *\n   * <p>Warning: This handle uses default order only in production environments,\
    \ during testing we\n   * randomize it. If you need to communicate with native\
    \ APIs (e.g., Java's Panama API), use {@link\n   * ByteOrder#nativeOrder()}.\n\
    \   */\n  public static final VarHandle VH_NATIVE_DOUBLE =\n      MethodHandles.byteArrayViewVarHandle(double[].class,\
    \ NATIVE_BYTE_ORDER);\n\n  /**\n   * A {@link VarHandle} to read/write big endian\
    \ {@code short} from a byte array. Shape: {@code\n   * short vh.get(byte[] arr,\
    \ int ofs)} and {@code void vh.set(byte[] arr, int ofs, short val)}\n   *\n  \
    \ * @deprecated Better use little endian unless it is needed for backwards compatibility.\n\
    \   */\n  @Deprecated\n  public static final VarHandle VH_BE_SHORT =\n      MethodHandles.byteArrayViewVarHandle(short[].class,\
    \ ByteOrder.BIG_ENDIAN);\n\n  /**\n   * A {@link VarHandle} to read/write big\
    \ endian {@code int} from a byte array. Shape: {@code int\n   * vh.get(byte[]\
    \ arr, int ofs)} and {@code void vh.set(byte[] arr, int ofs, int val)}\n   *\n\
    \   * @deprecated Better use little endian unless it is needed for backwards compatibility.\n\
    \   */\n  @Deprecated\n  public static final VarHandle VH_BE_INT =\n      MethodHandles.byteArrayViewVarHandle(int[].class,\
    \ ByteOrder.BIG_ENDIAN);\n\n  /**\n   * A {@link VarHandle} to read/write big\
    \ endian {@code long} from a byte array. Shape: {@code long\n   * vh.get(byte[]\
    \ arr, int ofs)} and {@code void vh.set(byte[] arr, int ofs, long val)}\n   *\n\
    \   * @deprecated Better use little endian unless it is needed for backwards compatibility.\n\
    \   */\n  @Deprecated\n  public static final VarHandle VH_BE_LONG =\n      MethodHandles.byteArrayViewVarHandle(long[].class,\
    \ ByteOrder.BIG_ENDIAN);\n\n  /**\n   * A {@link VarHandle} to read/write big\
    \ endian {@code float} from a byte array. Shape: {@code\n   * float vh.get(byte[]\
    \ arr, int ofs)} and {@code void vh.set(byte[] arr, int ofs, float val)}\n   *\n\
    \   * @deprecated Better use little endian unless it is needed for backwards compatibility.\n\
    \   */\n  @Deprecated\n  public static final VarHandle VH_BE_FLOAT =\n      MethodHandles.byteArrayViewVarHandle(float[].class,\
    \ ByteOrder.BIG_ENDIAN);\n\n  /**\n   * A {@link VarHandle} to read/write big\
    \ endian {@code double} from a byte array. Shape: {@code\n   * double vh.get(byte[]\
    \ arr, int ofs)} and {@code void vh.set(byte[] arr, int ofs, double val)}\n  \
    \ *\n   * @deprecated Better use little endian unless it is needed for backwards\
    \ compatibility.\n   */\n  @Deprecated\n  public static final VarHandle VH_BE_DOUBLE\
    \ =\n      MethodHandles.byteArrayViewVarHandle(double[].class, ByteOrder.BIG_ENDIAN);\n\
    \n  /**\n   * returns the next highest power of two, or the current value if it's\
    \ already a power of two or\n   * zero\n   */\n  public static int nextHighestPowerOfTwo(int\
    \ v) {\n    v--;\n    v |= v >> 1;\n    v |= v >> 2;\n    v |= v >> 4;\n    v\
    \ |= v >> 8;\n    v |= v >> 16;\n    v++;\n    return v;\n  }\n\n  /**\n   * returns\
    \ the next highest power of two, or the current value if it's already a power\
    \ of two or\n   * zero\n   */\n  public static long nextHighestPowerOfTwo(long\
    \ v) {\n    v--;\n    v |= v >> 1;\n    v |= v >> 2;\n    v |= v >> 4;\n    v\
    \ |= v >> 8;\n    v |= v >> 16;\n    v |= v >> 32;\n    v++;\n    return v;\n\
    \  }\n\n  // magic numbers for bit interleaving\n  private static final long MAGIC0\
    \ = 0x5555555555555555L;\n  private static final long MAGIC1 = 0x3333333333333333L;\n\
    \  private static final long MAGIC2 = 0x0F0F0F0F0F0F0F0FL;\n  private static final\
    \ long MAGIC3 = 0x00FF00FF00FF00FFL;\n  private static final long MAGIC4 = 0x0000FFFF0000FFFFL;\n\
    \  private static final long MAGIC5 = 0x00000000FFFFFFFFL;\n  private static final\
    \ long MAGIC6 = 0xAAAAAAAAAAAAAAAAL;\n\n  // shift values for bit interleaving\n\
    \  private static final long SHIFT0 = 1;\n  private static final long SHIFT1 =\
    \ 2;\n  private static final long SHIFT2 = 4;\n  private static final long SHIFT3\
    \ = 8;\n  private static final long SHIFT4 = 16;\n\n  /**\n   * Interleaves the\
    \ first 32 bits of each long value\n   *\n   * <p>Adapted from: http://graphics.stanford.edu/~seander/bithacks.html#InterleaveBMN\n\
    \   */\n  public static long interleave(int even, int odd) {\n    long v1 = 0x00000000FFFFFFFFL\
    \ & even;\n    long v2 = 0x00000000FFFFFFFFL & odd;\n    v1 = (v1 | (v1 << SHIFT4))\
    \ & MAGIC4;\n    v1 = (v1 | (v1 << SHIFT3)) & MAGIC3;\n    v1 = (v1 | (v1 << SHIFT2))\
    \ & MAGIC2;\n    v1 = (v1 | (v1 << SHIFT1)) & MAGIC1;\n    v1 = (v1 | (v1 << SHIFT0))\
    \ & MAGIC0;\n    v2 = (v2 | (v2 << SHIFT4)) & MAGIC4;\n    v2 = (v2 | (v2 << SHIFT3))\
    \ & MAGIC3;\n    v2 = (v2 | (v2 << SHIFT2)) & MAGIC2;\n    v2 = (v2 | (v2 << SHIFT1))\
    \ & MAGIC1;\n    v2 = (v2 | (v2 << SHIFT0)) & MAGIC0;\n\n    return (v2 << 1)\
    \ | v1;\n  }\n\n  /** Extract just the even-bits value as a long from the bit-interleaved\
    \ value */\n  public static long deinterleave(long b) {\n    b &= MAGIC0;\n  \
    \  b = (b ^ (b >>> SHIFT0)) & MAGIC1;\n    b = (b ^ (b >>> SHIFT1)) & MAGIC2;\n\
    \    b = (b ^ (b >>> SHIFT2)) & MAGIC3;\n    b = (b ^ (b >>> SHIFT3)) & MAGIC4;\n\
    \    b = (b ^ (b >>> SHIFT4)) & MAGIC5;\n    return b;\n  }\n\n  /** flip flops\
    \ odd with even bits */\n  public static long flipFlop(final long b) {\n    return\
    \ ((b & MAGIC6) >>> 1) | ((b & MAGIC0) << 1);\n  }\n\n  /** Same as {@link #zigZagEncode(long)}\
    \ but on integers. */\n  public static int zigZagEncode(int i) {\n    return (i\
    \ >> 31) ^ (i << 1);\n  }\n\n  /**\n   * <a href=\"https://developers.google.com/protocol-buffers/docs/encoding#types\"\
    >Zig-zag</a> encode\n   * the provided long. Assuming the input is a signed long\
    \ whose absolute value can be stored on\n   * <code>n</code> bits, the returned\
    \ value will be an unsigned long that can be stored on <code>\n   * n+1</code>\
    \ bits.\n   */\n  public static long zigZagEncode(long l) {\n    return (l >>\
    \ 63) ^ (l << 1);\n  }\n\n  /** Decode an int previously encoded with {@link #zigZagEncode(int)}.\
    \ */\n  public static int zigZagDecode(int i) {\n    return ((i >>> 1) ^ -(i &\
    \ 1));\n  }\n\n  /** Decode a long previously encoded with {@link #zigZagEncode(long)}.\
    \ */\n  public static long zigZagDecode(long l) {\n    return ((l >>> 1) ^ -(l\
    \ & 1));\n  }\n\n  /**\n   * Return true if, and only if, the provided integer\
    \ - treated as an unsigned integer - is either\n   * 0 or a power of two.\n  \
    \ */\n  public static boolean isZeroOrPowerOfTwo(int x) {\n    return (x & (x\
    \ - 1)) == 0;\n  }\n}\n\n### Source File Dependency Files Content\n### Dependency\
    \ File: empty.txt\n\nOutput the complete test file, code only, no explanations.\n\

    \ it under the terms of the GNU Lesser General Public\n// License as published\
    \ by the Free Software Foundation; either\n// version 2.1 of the License, or (at\
    \ your option) any later version.\n//\n// This library is distributed in the hope\
    \ that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied\
    \ warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the\
    \ GNU\n// Lesser General Public License for more details.\n//\n// You should have\
    \ received a copy of the GNU Lesser General Public\n// License along with this\
    \ library; if not, write to the Free Software\n// Foundation, Inc., 59 Temple\
    \ Place, Suite 330, Boston, MA  02111-1307  USA\n///////////////////////////////////////////////////////////////////////////////////////////////\n\
    \npackage com.puppycrawl.tools.checkstyle.api;\n\nimport java.util.Map;\n\nimport\
    \ com.puppycrawl.tools.checkstyle.AbstractAutomaticBean;\n\n/**\n * Serves as\
    \ an abstract base class for all modules that report inspection\n * findings.\
    \ Such modules have a Severity level which is used for the\n * {@link Violation\
    \ violations} that are created by the module.\n *\n * @noinspection NoopMethodInAbstractClass\n\
    \ * @noinspectionreason NoopMethodInAbstractClass - we allow each check to\n *\
    \      define these methods, as needed. They should be overridden only\n *   \
    \   by demand in subclasses\n */\npublic abstract class AbstractViolationReporter\n\
    \    extends AbstractAutomaticBean {\n\n    /** The severity level of any violations\
    \ found. */\n    private SeverityLevel severityLevel = SeverityLevel.ERROR;\n\n\
    \    /** The identifier of the reporter. */\n    private String id;\n\n    /**\n\
    \     * Returns the severity level of the violations generated by this module.\n\
    \     *\n     * @return the severity level\n     * @see SeverityLevel\n     *\
    \ @see Violation#getSeverityLevel\n     * @noinspection WeakerAccess\n     * @noinspectionreason\
    \ we avoid 'protected' when possible\n     */\n    public final SeverityLevel\
    \ getSeverityLevel() {\n        return severityLevel;\n    }\n\n    /**\n    \
    \ * Sets the severity level.  The string should be one of the names\n     * defined\
    \ in the {@code SeverityLevel} class.\n     *\n     * @param severity  The new\
    \ severity level\n     * @see SeverityLevel\n     */\n    public final void setSeverity(String\
    \ severity) {\n        severityLevel = SeverityLevel.getInstance(severity);\n\
    \    }\n\n    /**\n     *  Get the severity level's name.\n     *\n     *  @return\
    \  the check's severity level name.\n     *  @noinspection WeakerAccess\n    \
    \ *  @noinspectionreason WeakerAccess - we avoid 'protected' when possible\n \
    \    */\n    public final String getSeverity() {\n        return severityLevel.getName();\n\
    \    }\n\n    /**\n     * Returns the identifier of the reporter. Can be null.\n\
    \     *\n     * @return the id\n     */\n    public final String getId() {\n \
    \       return id;\n    }\n\n    /**\n     * Sets the identifier of the reporter.\
    \ Can be null.\n     *\n     * @param id the id\n     */\n    public final void\
    \ setId(final String id) {\n        this.id = id;\n    }\n\n    /**\n     * Returns\
    \ an unmodifiable map instance containing the custom messages\n     * for this\
    \ configuration.\n     *\n     * @return unmodifiable map containing custom messages\n\
    \     */\n    protected Map<String, String> getCustomMessages() {\n        return\
    \ getConfiguration().getMessages();\n    }\n\n    /**\n     * Returns the message\
    \ bundle name resource bundle that contains the messages\n     * used by this\
    \ module.\n     *\n     * <p>\n     * The default implementation expects the resource\
    \ files to be named\n     * messages.properties, messages_de.properties, etc.\
    \ The file must\n     * be placed in the same package as the module implementation.\n\
    \     * </p>\n     *\n     * <p>\n     * Example: If you write com/foo/MyCoolCheck,\
    \ create resource files\n     * com/foo/messages.properties, com/foo/messages_de.properties,\
    \ etc.\n     * </p>\n     *\n     * @return name of a resource bundle that contains\
    \ the messages\n     *     used by this module.\n     */\n    protected String\
    \ getMessageBundle() {\n        final String className = getClass().getName();\n\
    \        return getMessageBundle(className);\n    }\n\n    /**\n     * For unit\
    \ tests, especially with a class with no package name.\n     *\n     * @param\
    \ className class name of the module.\n     * @return name of a resource bundle\
    \ that contains the messages\n     *     used by the module.\n     */\n    private\
    \ static String getMessageBundle(final String className) {\n        final String\
    \ messageBundle;\n        final int endIndex = className.lastIndexOf('.');\n \
    \       final String messages = \"messages\";\n        if (endIndex == -1) {\n\
    \            messageBundle = messages;\n        }\n        else {\n          \
    \  final String packageName = className.substring(0, endIndex);\n            messageBundle\
    \ = packageName + \".\" + messages;\n        }\n        return messageBundle;\n\
    \    }\n\n    @Override\n    protected void finishLocalSetup() throws CheckstyleException\
    \ {\n        // No code by default\n    }\n\n    /**\n     * Log a message that\
    \ has no column information.\n     *\n     * @param line the line number where\
    \ the audit event was found\n     * @param key the message that describes the\
    \ audit event\n     * @param args the details of the message\n     *\n     * @see\
    \ java.text.MessageFormat\n     */\n    // -@cs[CustomDeclarationOrder] CustomDeclarationOrder\
    \ does not treat groups of\n    // overloaded methods. See https://github.com/sevntu-checkstyle/sevntu.checkstyle/issues/414\n\
    \    public abstract void log(int line, String key, Object... args);\n\n    /**\n\
    \     * Log a message that has column information.\n     *\n     * @param line\
    \ the line number where the audit event was found\n     * @param col the column\
    \ number where the audit event was found\n     * @param key the message that describes\
    \ the audit event\n     * @param args the details of the message\n     *\n   \
    \  * @see java.text.MessageFormat\n     */\n    // -@cs[CustomDeclarationOrder]\
    \ CustomDeclarationOrder does not treat groups of\n    // overloaded methods.\
    \ See https://github.com/sevntu-checkstyle/sevntu.checkstyle/issues/414\n    public\
    \ abstract void log(int line, int col, String key,\n            Object... args);\n\
    \n}\n\n### Source File Dependency Files Content\n### Dependency File: AbstractAutomaticBean.java\n\
    ///////////////////////////////////////////////////////////////////////////////////////////////\n\
    // checkstyle: Checks Java source code and other text files for adherence to a\
    \ set of rules.\n// Copyright (C) 2001-2025 the original author or authors.\n\
    //\n// This library is free software; you can redistribute it and/or\n// modify\
    \ it under the terms of the GNU Lesser General Public\n// License as published\
    \ by the Free Software Foundation; either\n// version 2.1 of the License, or (at\
    \ your option) any later version.\n//\n// This library is distributed in the hope\
    \ that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied\
    \ warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the\
    \ GNU\n// Lesser General Public License for more details.\n//\n// You should have\
    \ received a copy of the GNU Lesser General Public\n// License along with this\
    \ library; if not, write to the Free Software\n// Foundation, Inc., 59 Temple\
    \ Place, Suite 330, Boston, MA  02111-1307  USA\n///////////////////////////////////////////////////////////////////////////////////////////////\n\
    \npackage com.puppycrawl.tools.checkstyle;\n\nimport java.beans.PropertyDescriptor;\n\
    import java.lang.reflect.InvocationTargetException;\nimport java.net.URI;\nimport\
    \ java.util.ArrayList;\nimport java.util.Collection;\nimport java.util.List;\n\
    import java.util.Locale;\nimport java.util.StringTokenizer;\nimport java.util.regex.Pattern;\n\
    \nimport javax.annotation.Nullable;\n\nimport org.apache.commons.beanutils.BeanUtilsBean;\n\
    import org.apache.commons.beanutils.ConversionException;\nimport org.apache.commons.beanutils.ConvertUtilsBean;\n\
    import org.apache.commons.beanutils.Converter;\nimport org.apache.commons.beanutils.PropertyUtils;\n\
    import org.apache.commons.beanutils.PropertyUtilsBean;\nimport org.apache.commons.beanutils.converters.ArrayConverter;\n\
    import org.apache.commons.beanutils.converters.BooleanConverter;\nimport org.apache.commons.beanutils.converters.ByteConverter;\n\
    import org.apache.commons.beanutils.converters.CharacterConverter;\nimport org.apache.commons.beanutils.converters.DoubleConverter;\n\
    import org.apache.commons.beanutils.converters.FloatConverter;\nimport org.apache.commons.beanutils.converters.IntegerConverter;\n\
    import org.apache.commons.beanutils.converters.LongConverter;\nimport org.apache.commons.beanutils.converters.ShortConverter;\n\
    \nimport com.puppycrawl.tools.checkstyle.api.CheckstyleException;\nimport com.puppycrawl.tools.checkstyle.api.Configurable;\n\
    import com.puppycrawl.tools.checkstyle.api.Configuration;\nimport com.puppycrawl.tools.checkstyle.api.Context;\n\
    import com.puppycrawl.tools.checkstyle.api.Contextualizable;\nimport com.puppycrawl.tools.checkstyle.api.Scope;\n\
    import com.puppycrawl.tools.checkstyle.api.SeverityLevel;\nimport com.puppycrawl.tools.checkstyle.checks.naming.AccessModifierOption;\n\
    import com.puppycrawl.tools.checkstyle.utils.CommonUtil;\n\n/**\n * A Java Bean\
    \ that implements the component lifecycle interfaces by\n * calling the bean's\
    \ setters for all configuration attributes.\n */\npublic abstract class AbstractAutomaticBean\n\
    \    implements Configurable, Contextualizable {\n\n    /**\n     * Enum to specify\
    \ behaviour regarding ignored modules.\n     */\n    public enum OutputStreamOptions\
    \ {\n\n        /**\n         * Close stream in the end.\n         */\n       \
    \ CLOSE,\n\n        /**\n         * Do nothing in the end.\n         */\n    \
    \    NONE,\n\n    }\n\n    /** Comma separator for StringTokenizer. */\n    private\
    \ static final String COMMA_SEPARATOR = \",\";\n\n    /** The configuration of\
    \ this bean. */\n    private Configuration configuration;\n\n    /**\n     * Provides\
    \ a hook to finish the part of this component's setup that\n     * was not handled\
    \ by the bean introspection.\n     *\n     * <p>\n     * The default implementation\
    \ does nothing.\n     * </p>\n     *\n     * @throws CheckstyleException if there\
    \ is a configuration error.\n     */\n    protected abstract void finishLocalSetup()\
    \ throws CheckstyleException;\n\n    /**\n     * Creates a BeanUtilsBean that\
    \ is configured to use\n     * type converters that throw a ConversionException\n\
    \     * instead of using the default value when something\n     * goes wrong.\n\
    \     *\n     * @return a configured BeanUtilsBean\n     */\n    private static\
    \ BeanUtilsBean createBeanUtilsBean() {\n        final ConvertUtilsBean cub =\
    \ new ConvertUtilsBean();\n\n        registerIntegralTypes(cub);\n        registerCustomTypes(cub);\n\
    \n        return new BeanUtilsBean(cub, new PropertyUtilsBean());\n    }\n\n \
    \   /**\n     * Register basic types of JDK like boolean, int, and String to use\
    \ with BeanUtils. All these\n     * types are found in the {@code java.lang} package.\n\
    \     *\n     * @param cub\n     *            Instance of {@link ConvertUtilsBean}\
    \ to register types with.\n     */\n    private static void registerIntegralTypes(ConvertUtilsBean\
    \ cub) {\n        cub.register(new BooleanConverter(), Boolean.TYPE);\n      \
    \  cub.register(new BooleanConverter(), Boolean.class);\n        cub.register(new\
    \ ArrayConverter(\n            boolean[].class, new BooleanConverter()), boolean[].class);\n\
    \        cub.register(new ByteConverter(), Byte.TYPE);\n        cub.register(new\
    \ ByteConverter(), Byte.class);\n        cub.register(new ArrayConverter(byte[].class,\
    \ new ByteConverter()),\n            byte[].class);\n        cub.register(new\
    \ CharacterConverter(), Character.TYPE);\n        cub.register(new CharacterConverter(),\
    \ Character.class);\n        cub.register(new ArrayConverter(char[].class, new\
    \ CharacterConverter()),\n            char[].class);\n        cub.register(new\
    \ DoubleConverter(), Double.TYPE);\n        cub.register(new DoubleConverter(),\
    \ Double.class);\n        cub.register(new ArrayConverter(double[].class, new\
    \ DoubleConverter()),\n            double[].class);\n        cub.register(new\
    \ FloatConverter(), Float.TYPE);\n        cub.register(new FloatConverter(), Float.class);\n\
    \        cub.register(new ArrayConverter(float[].class, new FloatConverter()),\n\
    \            float[].class);\n        cub.register(new IntegerConverter(), Integer.TYPE);\n\
    \        cub.register(new IntegerConverter(), Integer.class);\n        cub.register(new\
    \ ArrayConverter(int[].class, new IntegerConverter()),\n            int[].class);\n\
    \        cub.register(new LongConverter(), Long.TYPE);\n        cub.register(new\
    \ LongConverter(), Long.class);\n        cub.register(new ArrayConverter(long[].class,\
    \ new LongConverter()),\n            long[].class);\n        cub.register(new\
    \ ShortConverter(), Short.TYPE);\n        cub.register(new ShortConverter(), Short.class);\n\
    \        cub.register(new ArrayConverter(short[].class, new ShortConverter()),\n\
    \            short[].class);\n        cub.register(new RelaxedStringArrayConverter(),\
    \ String[].class);\n\n        // BigDecimal, BigInteger, Class, Date, String,\
    \ Time, TimeStamp\n        // do not use defaults in the default configuration\
    \ of ConvertUtilsBean\n    }\n\n    /**\n     * Register custom types of JDK like\
    \ URI and Checkstyle specific classes to use with BeanUtils.\n     * None of these\
    \ types should be found in the {@code java.lang} package.\n     *\n     * @param\
    \ cub\n     *            Instance of {@link ConvertUtilsBean} to register types\
    \ with.\n     */\n    private static void registerCustomTypes(ConvertUtilsBean\
    \ cub) {\n        cub.register(new PatternConverter(), Pattern.class);\n     \
    \   cub.register(new PatternArrayConverter(), Pattern[].class);\n        cub.register(new\
    \ SeverityLevelConverter(), SeverityLevel.class);\n        cub.register(new ScopeConverter(),\
    \ Scope.class);\n        cub.register(new UriConverter(), URI.class);\n      \
    \  cub.register(new RelaxedAccessModifierArrayConverter(), AccessModifierOption[].class);\n\
    \    }\n\n    /**\n     * Implements the Configurable interface using bean introspection.\n\
    \     *\n     * <p>Subclasses are allowed to add behaviour. After the bean\n \
    \    * based setup has completed first the method\n     * {@link #finishLocalSetup\
    \ finishLocalSetup}\n     * is called to allow completion of the bean's local\
    \ setup,\n     * after that the method {@link #setupChild setupChild}\n     *\
    \ is called for each {@link Configuration#getChildren child Configuration}\n \
    \    * of {@code configuration}.\n     *\n     * @see Configurable\n     */\n\
    \    @Override\n    public final void configure(Configuration config)\n      \
    \      throws CheckstyleException {\n        configuration = config;\n\n     \
    \   final String[] attributes = config.getPropertyNames();\n\n        for (final\
    \ String key : attributes) {\n            final String value = config.getProperty(key);\n\
    \n            tryCopyProperty(key, value, true);\n        }\n\n        finishLocalSetup();\n\
    \n        final Configuration[] childConfigs = config.getChildren();\n       \
    \ for (final Configuration childConfig : childConfigs) {\n            setupChild(childConfig);\n\
    \        }\n    }\n\n    /**\n     * Recheck property and try to copy it.\n  \
    \   *\n     * @param key key of value\n     * @param value value\n     * @param\
    \ recheck whether to check for property existence before copy\n     * @throws\
    \ CheckstyleException when property defined incorrectly\n     */\n    private\
    \ void tryCopyProperty(String key, Object value, boolean recheck)\n          \
    \  throws CheckstyleException {\n        final BeanUtilsBean beanUtils = createBeanUtilsBean();\n\
    \n        try {\n            if (recheck) {\n                // BeanUtilsBean.copyProperties\
    \ silently ignores missing setters\n                // for key, so we have to\
    \ go through great lengths here to\n                // figure out if the bean\
    \ property really exists.\n                final PropertyDescriptor descriptor\
    \ =\n                        PropertyUtils.getPropertyDescriptor(this, key);\n\
    \                if (descriptor == null) {\n                    final String message\
    \ = String.format(Locale.ROOT, \"Property '%s' \"\n                          \
    \  + \"does not exist, please check the documentation\", key);\n             \
    \       throw new CheckstyleException(message);\n                }\n         \
    \   }\n            // finally we can set the bean property\n            beanUtils.copyProperty(this,\
    \ key, value);\n        }\n        catch (final InvocationTargetException | IllegalAccessException\n\
    \                | NoSuchMethodException ex) {\n            // There is no way\
    \ to catch IllegalAccessException | NoSuchMethodException\n            // as we\
    \ do PropertyUtils.getPropertyDescriptor before beanUtils.copyProperty,\n    \
    \        // so we have to join these exceptions with InvocationTargetException\n\
    \            // to satisfy UTs coverage\n            final String message = String.format(Locale.ROOT,\n\
    \                    \"Cannot set property '%s' to '%s'\", key, value);\n    \
    \        throw new CheckstyleException(message, ex);\n        }\n        catch\
    \ (final IllegalArgumentException | ConversionException ex) {\n            final\
    \ String message = String.format(Locale.ROOT, \"illegal value '%s' for property\
    \ \"\n                    + \"'%s'\", value, key);\n            throw new CheckstyleException(message,\
    \ ex);\n        }\n    }\n\n    /**\n     * Implements the Contextualizable interface\
    \ using bean introspection.\n     *\n     * @see Contextualizable\n     */\n \
    \   @Override\n    public final void contextualize(Context context)\n        \
    \    throws CheckstyleException {\n        final Collection<String> attributes\
    \ = context.getAttributeNames();\n\n        for (final String key : attributes)\
    \ {\n            final Object value = context.get(key);\n\n            tryCopyProperty(key,\
    \ value, false);\n        }\n    }\n\n    /**\n     * Returns the configuration\
    \ that was used to configure this component.\n     *\n     * @return the configuration\
    \ that was used to configure this component.\n     */\n    protected final Configuration\
    \ getConfiguration() {\n        return configuration;\n    }\n\n    /**\n    \
    \ * Called by configure() for every child of this component's Configuration.\n\
    \     *\n     * <p>\n     * The default implementation throws {@link CheckstyleException}\
    \ if\n     * {@code childConf} is {@code null} because it doesn't support children.\
    \ It\n     * must be overridden to validate and support children that are wanted.\n\
    \     * </p>\n     *\n     * @param childConf a child of this component's Configuration\n\
    \     * @throws CheckstyleException if there is a configuration error.\n     *\
    \ @see Configuration#getChildren\n     */\n    protected void setupChild(Configuration\
    \ childConf)\n            throws CheckstyleException {\n        if (childConf\
    \ != null) {\n            throw new CheckstyleException(childConf.getName() +\
    \ \" is not allowed as a child in \"\n                    + configuration.getName()\
    \ + \". Please review 'Parent Module' section \"\n                    + \"for\
    \ this Check in web documentation if Check is standard.\");\n        }\n    }\n\
    \n    /** A converter that converts a string to a pattern. */\n    private static\
    \ final class PatternConverter implements Converter {\n\n        @SuppressWarnings(\"\
    unchecked\")\n        @Override\n        public Object convert(Class type, Object\
    \ value) {\n            return CommonUtil.createPattern(value.toString());\n \
    \       }\n\n    }\n\n    /** A converter that converts a comma-separated string\
    \ into an array of patterns. */\n    private static final class PatternArrayConverter\
    \ implements Converter {\n\n        @SuppressWarnings(\"unchecked\")\n       \
    \ @Override\n        public Object convert(Class type, Object value) {\n     \
    \       final StringTokenizer tokenizer = new StringTokenizer(\n             \
    \       value.toString(), COMMA_SEPARATOR);\n            final List<Pattern> result\
    \ = new ArrayList<>();\n\n            while (tokenizer.hasMoreTokens()) {\n  \
    \              final String token = tokenizer.nextToken();\n                result.add(CommonUtil.createPattern(token.trim()));\n\
    \            }\n\n            return result.toArray(new Pattern[0]);\n       \
    \ }\n    }\n\n    /** A converter that converts strings to severity level. */\n\
    \    private static final class SeverityLevelConverter implements Converter {\n\
    \n        @SuppressWarnings(\"unchecked\")\n        @Override\n        public\
    \ Object convert(Class type, Object value) {\n            return SeverityLevel.getInstance(value.toString());\n\
    \        }\n\n    }\n\n    /** A converter that converts strings to scope. */\n\
    \    private static final class ScopeConverter implements Converter {\n\n    \
    \    @SuppressWarnings(\"unchecked\")\n        @Override\n        public Object\
    \ convert(Class type, Object value) {\n            return Scope.getInstance(value.toString());\n\
    \        }\n\n    }\n\n    /** A converter that converts strings to uri. */\n\
    \    private static final class UriConverter implements Converter {\n\n      \
    \  @SuppressWarnings(\"unchecked\")\n        @Override\n        @Nullable\n  \
    \      public Object convert(Class type, Object value) {\n            final String\
    \ url = value.toString();\n            URI result = null;\n\n            if (!CommonUtil.isBlank(url))\
    \ {\n                try {\n                    result = CommonUtil.getUriByFilename(url);\n\
    \                }\n                catch (CheckstyleException ex) {\n       \
    \             throw new IllegalArgumentException(ex);\n                }\n   \
    \         }\n\n            return result;\n        }\n\n    }\n\n    /**\n   \
    \  * A converter that does not care whether the array elements contain String\n\
    \     * characters like '*' or '_'. The normal ArrayConverter class has problems\n\
    \     * with these characters.\n     */\n    private static final class RelaxedStringArrayConverter\
    \ implements Converter {\n\n        @SuppressWarnings(\"unchecked\")\n       \
    \ @Override\n        public Object convert(Class type, Object value) {\n     \
    \       final StringTokenizer tokenizer = new StringTokenizer(\n             \
    \   value.toString().trim(), COMMA_SEPARATOR);\n            final List<String>\
    \ result = new ArrayList<>();\n\n            while (tokenizer.hasMoreTokens())\
    \ {\n                final String token = tokenizer.nextToken();\n           \
    \     result.add(token.trim());\n            }\n\n            return result.toArray(CommonUtil.EMPTY_STRING_ARRAY);\n\
    \        }\n\n    }\n\n    /**\n     * A converter that converts strings to {@link\
    \ AccessModifierOption}.\n     * This implementation does not care whether the\
    \ array elements contain characters like '_'.\n     * The normal {@link ArrayConverter}\
    \ class has problems with this character.\n     */\n    private static final class\
    \ RelaxedAccessModifierArrayConverter implements Converter {\n\n        /** Constant\
    \ for optimization. */\n        private static final AccessModifierOption[] EMPTY_MODIFIER_ARRAY\
    \ =\n                new AccessModifierOption[0];\n\n        @SuppressWarnings(\"\
    unchecked\")\n        @Override\n        public Object convert(Class type, Object\
    \ value) {\n            // Converts to a String and trims it for the tokenizer.\n\
    \            final StringTokenizer tokenizer = new StringTokenizer(\n        \
    \        value.toString().trim(), COMMA_SEPARATOR);\n            final List<AccessModifierOption>\
    \ result = new ArrayList<>();\n\n            while (tokenizer.hasMoreTokens())\
    \ {\n                final String token = tokenizer.nextToken();\n           \
    \     result.add(AccessModifierOption.getInstance(token));\n            }\n\n\
    \            return result.toArray(EMPTY_MODIFIER_ARRAY);\n        }\n\n    }\n\
    \n}\n\nOutput the complete test file, code only, no explanations.\n### Time\n\
    Current time: 2025-04-11 14:25:29\n"
